<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Geometry 4.1 and 4.2 Quiz Guide</title>
<style>
:root{--bg:#0f1420;--panel:#171e2e;--panel2:#1d2639;--line:#2a3550;--ink:#e9ecf3;--mute:#9aa6bf;--ok:#34d399;--bad:#f87171;--warn:#fbbf24;--blue:#60a5fa;--r:14px;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#nav{position:sticky;top:0;z-index:20;display:flex;gap:6px;align-items:center;overflow-x:auto;padding:10px 14px;background:rgba(15,20,32,.96);border-bottom:1px solid var(--line);backdrop-filter:blur(6px)}
.logo{font-weight:700;white-space:nowrap;margin-right:6px}
.nb{white-space:nowrap;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 13px;font-size:14px}
.nb.on{background:var(--c,#60a5fa);border-color:var(--c,#60a5fa);color:#0b1020;font-weight:700}
main{max-width:860px;margin:0 auto;padding:18px 16px 70px}
h1,h2,h3{line-height:1.2;margin:0 0 10px}.newb{font-size:10px;font-weight:700;letter-spacing:.04em;padding:1px 6px;border-radius:99px;background:#fbbf24;color:#1a1d26;vertical-align:middle;margin-left:4px}
.hero{padding:22px 18px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(135deg,#1b2742,#16213a);margin-bottom:16px}
.hero h1{font-size:28px}
.hero p{margin:6px 0 0;color:var(--mute)}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.howto>div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.howto b{display:block}.howto span{color:var(--mute);font-size:14px}
.seccards,.wide{display:grid;gap:12px;margin-bottom:12px}
.seccards{grid-template-columns:repeat(3,1fr)}
.wide{grid-template-columns:repeat(2,1fr)}
.sc{text-align:left;background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c);border-radius:var(--r);padding:14px}
.sc:hover{background:var(--panel2)}
.sc .id{color:var(--c);font-weight:800;font-size:22px}
.sc h3{font-size:17px;margin:2px 0 6px}
.sc p{margin:0 0 8px;color:var(--mute);font-size:14px}
.bar{height:7px;border-radius:99px;background:#26324d;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.small{font-size:13px;color:var(--mute);margin-top:4px}
.sechead{border-left:6px solid var(--c);padding-left:12px;margin-bottom:12px}
.sechead .id{color:var(--c);font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:13px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px}
.tab.on{background:var(--c);border-color:var(--c);color:#0b1020;font-weight:700}
.topic,.setbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.topic h3 .n{display:inline-block;background:var(--c);color:#0b1020;font-size:12px;font-weight:800;border-radius:99px;padding:1px 9px;margin-right:8px;vertical-align:2px}
.content p{margin:0 0 10px}.content ul,.content ol{margin:0 0 10px;padding-left:22px}.content li{margin-bottom:4px}
.hl{color:var(--warn);font-weight:700}
.t{color:var(--ok)}.f{color:var(--bad)}
.tip{background:#1f2a43;border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;margin:10px 0}
.tbl{width:100%;border-collapse:collapse;margin:8px 0 12px;font-size:15px}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--panel2)}
.fig{background:#fff;border-radius:10px;padding:8px;margin:10px 0;text-align:center;overflow-x:auto}
.fig img{max-width:100%;height:auto;vertical-align:middle}
.q{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px;margin:12px 0}
.q.ok{border-color:#1f6f55}.q.bad{border-color:#7b3a3a}
.qh{display:flex;gap:10px;align-items:flex-start}
.num{flex:none;background:#26324d;border-radius:8px;padding:1px 8px;font-size:12px;color:var(--mute);margin-top:3px;white-space:nowrap}
.qt{flex:1}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;background:#121a2b;border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.right{border-color:var(--ok);background:#12332b}
.opt.wrong{border-color:var(--bad);background:#3a1d22}
.opt:disabled{cursor:default;color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.ti{flex:1;min-width:150px;background:#121a2b;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
.btn{background:var(--blue);border:0;color:#0b1020;font-weight:700;border-radius:10px;padding:9px 16px}
.btn.sm{padding:7px 13px;font-size:14px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.fb{margin-top:10px;padding:8px 12px;border-radius:9px;font-weight:600}
.fb.ok{background:#12332b;color:#8ef0c7}.fb.bad{background:#3a1d22;color:#ffb4b4}
.steps,.ans{margin-top:10px;background:#141c2d;border:1px dashed #3a4a70;border-radius:10px;padding:10px 12px}
.steps>b,.ans>b{display:block;color:var(--warn);font-size:13px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px}
.proof{width:100%;border-collapse:collapse;margin-top:10px}
.proof td,.proof th{border:1px solid var(--line);padding:6px 8px;vertical-align:top;font-size:15px}
.proof th{background:#121a2b;text-align:left}
.proof select{width:100%;background:#121a2b;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px;font:inherit;font-size:14px}
.proof tr.rok td:last-child{background:#12332b}.proof tr.rbad td:last-child{background:#3a1d22}
.why{font-size:13px;color:var(--mute);margin-top:3px}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:14px}
.tprog{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:6px}
.fl{perspective:900px;margin:14px 0}
.fcard{min-height:200px;background:var(--panel);border:2px solid var(--c,#fbbf24);border-radius:18px;padding:26px 20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:21px;cursor:pointer;width:100%}
.fcard.back{background:#1f2a43;font-size:19px}
.fcard small{display:block;color:var(--mute);font-size:13px;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px}
.chip.on{background:#fbbf24;color:#0b1020;border-color:#fbbf24;font-weight:700}
.score{font-size:46px;font-weight:800}
.secres{display:grid;gap:10px;margin:14px 0}
.secres>div{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:12px}
.miss{margin:6px 0 0;padding-left:18px;color:var(--mute);font-size:14px}
@media (max-width:640px){.howto,.seccards,.wide{grid-template-columns:1fr}.hero h1{font-size:24px}main{padding:14px 12px 60px}.fcard{font-size:19px}}
</style>
</head>

<main id="app"></main>
<script type="application/json" id="data">{"sections": [{"id": "4.1", "title": "Apply Triangle Sum Properties", "blurb": "Classifying triangles by sides and angles, the Triangle Sum Theorem, the Exterior Angle Theorem, isosceles and equilateral algebra, and classifying on a coordinate plane.", "topics": [{"h": "Classify triangles by their sides", "body": "<p>Count the congruent sides (the tick marks tell you which sides match).<\/p>\n<table class=\"tbl\"><tr><th>Name<\/th><th>Congruent sides<\/th><th>Looks like<\/th><\/tr>\n<tr><td><b>Scalene<\/b><\/td><td><b>0<\/b><\/td><td>all three sides different lengths<\/td><\/tr>\n<tr><td><b>Isosceles<\/b><\/td><td><b>at least 2<\/b><\/td><td>two matching legs (and a base)<\/td><\/tr>\n<tr><td><b>Equilateral<\/b><\/td><td><b>3<\/b><\/td><td>all three sides the same<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Notice:<\/b> every equilateral triangle is also isosceles (it has at least two congruent sides). That is why &ldquo;an equilateral triangle has two congruent sides&rdquo; is <i>always<\/i> true.<\/div>", "check": {"t": "mc", "q": "A triangle has side lengths 7 cm, 7 cm and 10 cm. How do you classify it by its sides?", "opts": ["Isosceles", "Equilateral", "Right", "Scalene"], "ans": 0, "steps": "Two sides are equal (7 and 7), and the third is different, so it is <b>isosceles<\/b>."}}, {"h": "Classify triangles by their angles", "body": "<table class=\"tbl\"><tr><th>Name<\/th><th>Angles<\/th><\/tr>\n<tr><td><b>Acute<\/b><\/td><td>3 acute angles (all less than 90&deg;)<\/td><\/tr>\n<tr><td><b>Right<\/b><\/td><td>1 right angle (90&deg;)<\/td><\/tr>\n<tr><td><b>Obtuse<\/b><\/td><td>1 obtuse angle (more than 90&deg;)<\/td><\/tr>\n<tr><td><b>Equiangular<\/b><\/td><td>3 congruent angles (each 60&deg;)<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Notice:<\/b> an equiangular triangle is also acute. A triangle can never have two right angles or two obtuse angles, because the angles must add to 180&deg;.<\/div>", "check": {"t": "mc", "q": "A triangle has angles of 29&deg;, 113&deg; and 38&deg;. How do you classify it by its angles?", "opts": ["Acute", "Obtuse", "Equiangular", "Right"], "ans": 1, "steps": "113&deg; is bigger than 90&deg;, so the triangle is <b>obtuse<\/b>."}}, {"h": "The Triangle Sum Theorem", "body": "<p>The three <b>interior angles<\/b> of any triangle add up to <b>180&deg;<\/b>.<\/p>\n<p><b>Method:<\/b> add the angles you know, set the total equal to 180, solve.<\/p>\n<p><i>Example.<\/i> Angles 46&deg;, 76&deg; and x&deg;: 46 + 76 + x = 180, so 122 + x = 180 and <b>x = 58<\/b>.<\/p>\n<div class=\"tip\"><b>Right triangle shortcut:<\/b> the right angle uses 90&deg;, so the other two angles add to 90&deg;.<\/div>", "check": {"t": "text", "q": "Two angles of a triangle measure 50&deg; and 65&deg;. Find the third angle (just the number).", "accept": ["65"], "steps": "50 + 65 = 115 and 180 &minus; 115 = <b>65&deg;<\/b>.", "show": "65"}}, {"h": "Interior angles, exterior angles and the Exterior Angle Theorem", "body": "<p><b>Interior angles<\/b> are the three original angles inside the triangle. An <b>exterior angle<\/b> forms when you extend a side: it is <b>adjacent<\/b> to an interior angle and makes a linear pair with it.<\/p>\n<table class=\"tbl\"><tr><th>Theorem<\/th><th>Meaning<\/th><\/tr>\n<tr><td><b>Exterior Angle Theorem<\/b><\/td><td>An exterior angle equals the <b>sum of the two non-adjacent (remote) interior angles<\/b>.<\/td><\/tr><\/table>\n<p><i>Example.<\/i> Exterior angle (3x &minus; 9)&deg;, remote interior angles 73&deg; and x&deg;: 3x &minus; 9 = 73 + x, so 2x = 82 and <b>x = 41<\/b>. The exterior angle is 3(41) &minus; 9 = 114&deg;.<\/p>\n<div class=\"tip\"><b>Check:<\/b> the exterior angle and its neighbor inside the triangle must add to 180&deg; (114 + 66 = 180).<\/div>", "check": {"t": "mc", "q": "An exterior angle of a triangle measures 120&deg;. One remote interior angle is 45&deg;. What is the other remote interior angle?", "opts": ["65&deg;", "165&deg;", "75&deg;", "60&deg;"], "ans": 2, "steps": "The exterior angle equals the sum of the two remote angles: 45 + ? = 120, so ? = <b>75&deg;<\/b>."}}, {"h": "Isosceles and equilateral triangles: set the matching parts equal", "body": "<p>In an isosceles triangle the two <b>legs<\/b> are congruent and the <b>base angles<\/b> are congruent. The angle between the legs is the <b>vertex angle<\/b>.<\/p>\n<p><b>Method:<\/b> set the two expressions for the congruent sides equal, solve for x, then <b>substitute<\/b> to find each side.<\/p>\n<p><i>Example (isosceles with vertex M).<\/i> JM = 2x &minus; 5 and MN = 3x &minus; 9: 2x &minus; 5 = 3x &minus; 9 gives <b>x = 4<\/b>. Then JM = MN = 3, and JN = x &minus; 2 = <b>2<\/b>.<\/p>\n<div class=\"tip\"><b>Watch out:<\/b> the <i>vertex<\/i> angle tells you which two sides are the legs. In &Delta;XYZ with vertex X, the legs are XY and XZ (not YZ). In an equilateral triangle every side is equal and every angle is 60&deg;.<\/div>", "check": {"t": "mc", "q": "&Delta;ABC is isosceles with vertex angle A. Which two sides are congruent?", "opts": ["BC and AB", "All three sides", "BC and AC", "AB and AC"], "ans": 3, "steps": "The legs meet at the vertex angle A, so the congruent sides are <b>AB and AC<\/b>."}}, {"h": "Classify a triangle on the coordinate plane", "body": "<p><b>Sides:<\/b> use the distance formula, d = &radic;[(x&#8322; &minus; x&#8321;)&sup2; + (y&#8322; &minus; y&#8321;)&sup2;], on all three sides, and compare the lengths.<\/p>\n<p><b>Right angle:<\/b> find the slopes. If two sides have <b>opposite reciprocal slopes<\/b> (product &minus;1), they are perpendicular, so the triangle is a <b>right<\/b> triangle. (You can also test a&sup2; + b&sup2; = c&sup2;.)<\/p>\n<p><i>Example.<\/i> R(&minus;3, 3), S(5, 2), T(3, &minus;1): RT = &radic;52, ST = &radic;13, RS = &radic;65, all different, so <b>scalene<\/b>. Slope of RT = &minus;2/3 and slope of ST = 3/2 are opposite reciprocals, so RT &#8869; ST: a <b>right<\/b> triangle (right angle at T). Check: 52 + 13 = 65.<\/p>", "check": {"t": "mc", "q": "A triangle has side lengths &radic;13, &radic;52 and &radic;65. Is it a right triangle?", "opts": ["Yes, because 13 + 52 = 65", "No, because the sides are all different", "Yes, because the sides are all different", "No, because 13 + 52 is not 65"], "ans": 0, "steps": "Square-root lengths square to 13, 52 and 65. 13 + 52 = 65, so a&sup2; + b&sup2; = c&sup2;: <b>right triangle<\/b>.", "svg": "c4"}}], "sets": [{"title": "Class notes 4.1", "note": "Every example from your 4.1 notes, with answers from the class key.", "probs": [{"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle by its sides and angles.", "opts": ["Equilateral and acute", "Isosceles and acute", "Isosceles and obtuse", "Scalene and acute"], "ans": 1, "steps": "Two tick marks match, so <b>isosceles<\/b>. All three angles look less than 90&deg;, so <b>acute<\/b>.", "svg": "c1_a", "num": "Ex 1 (1)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle (sides 7 ft, 4 ft, 10 ft).", "opts": ["Isosceles and obtuse", "Scalene and right", "Scalene and obtuse", "Scalene and acute"], "ans": 2, "steps": "All three sides differ, so <b>scalene<\/b>. The longest side (10) is opposite a wide angle: 7&sup2; + 4&sup2; = 65 is less than 10&sup2; = 100, so the angle is <b>obtuse<\/b>.", "svg": "c1_b", "num": "Ex 1 (2)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle.", "opts": ["Scalene and right", "Equilateral and right", "Isosceles and acute", "Isosceles and right"], "ans": 3, "steps": "The tick marks show two equal legs: <b>isosceles<\/b>. The square marks a 90&deg; angle: <b>right<\/b>.", "svg": "c1_c", "num": "Ex 1 (3)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle (sides 27 in, 21 in, 30 in).", "opts": ["Scalene and right", "Isosceles and right", "Scalene and obtuse", "Scalene and acute"], "ans": 0, "steps": "27, 21 and 30 are all different: <b>scalene<\/b>. The square marks the right angle: <b>right<\/b>.", "svg": "c1_d", "num": "Ex 1 (4)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle.", "opts": ["Scalene and acute", "Equilateral and equiangular", "Isosceles and right", "Equilateral and obtuse"], "ans": 1, "steps": "Three tick marks: all sides equal, so <b>equilateral<\/b>. An equilateral triangle has three 60&deg; angles, so it is <b>equiangular<\/b>.", "svg": "c1_e", "num": "Ex 1 (5)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 1.<\/b> Classify this triangle.", "opts": ["Scalene and acute", "Scalene and right", "Scalene and obtuse", "Isosceles and obtuse"], "ans": 2, "steps": "Angles 29, 113, 38 are all different, so the sides are all different: <b>scalene<\/b>. 113&deg; is more than 90&deg;: <b>obtuse<\/b>.", "svg": "c1_f", "num": "Ex 1 (6)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 2.<\/b> &Delta;JMN is isosceles with vertex angle M. JM = 2x &minus; 5 and MN = 3x &minus; 9. Find x.", "accept": ["4"], "steps": "The legs JM and MN are equal: 2x &minus; 5 = 3x &minus; 9. Subtract 2x: &minus;5 = x &minus; 9. Add 9: <b>x = 4<\/b>.", "show": "4", "svg": "c2", "num": "Ex 2 (x)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 2.<\/b> Using x = 4: find JM (the length of side JM = 2x &minus; 5).", "accept": ["3"], "steps": "JM = 2(4) &minus; 5 = 8 &minus; 5 = <b>3<\/b>. (MN = 3(4) &minus; 9 = 3 as well.)", "show": "3", "svg": "c2", "num": "Ex 2 (JM)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 2.<\/b> Using x = 4: find JN (the base, JN = x &minus; 2).", "accept": ["2"], "steps": "JN = 4 &minus; 2 = <b>2<\/b>.", "show": "2", "svg": "c2", "num": "Ex 2 (JN)", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 4a.<\/b> &Delta;RST has R(&minus;3, 3), S(5, 2), T(3, &minus;1). The side lengths are RT = &radic;52, ST = &radic;13 and RS = &radic;65. Classify the triangle by its sides.", "opts": ["Equilateral", "Right", "Isosceles", "Scalene"], "ans": 3, "steps": "&radic;52, &radic;13 and &radic;65 are three different lengths: <b>scalene<\/b>.", "svg": "c4", "num": "Ex 4a", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 4b.<\/b> Is &Delta;RST a right triangle? The slope of RT is &minus;2/3 and the slope of ST is 3/2.", "opts": ["Yes: the slopes are opposite reciprocals, so RT &#8869; ST", "No: the slopes are different, so the sides are not perpendicular", "No: the slopes multiply to 1, not &minus;1, so there is no right angle", "Yes: the slopes are equal, so the sides are perpendicular"], "ans": 0, "steps": "(&minus;2/3)(3/2) = &minus;1, so the slopes are opposite reciprocals and RT &#8869; ST. The right angle is at T.<br><b>Key note:<\/b> the notes key labels the 3/2 slope &ldquo;m<sub>RT<\/sub>&rdquo;. It should be <b>m<sub>ST<\/sub><\/b> (RT &#8869; ST).", "svg": "c4", "num": "Ex 4b", "sec": 0}, {"t": "text", "q": "<b>Notes Example 5.1.<\/b> Solve for x.", "accept": ["58"], "steps": "46 + 76 + x = 180, so 122 + x = 180 and <b>x = 58<\/b>.", "show": "58", "svg": "c5_1", "num": "Ex 5.1", "sec": 0}, {"t": "text", "q": "<b>Notes Example 5.2.<\/b> Solve for x.", "accept": ["9"], "steps": "(7x &minus; 1) + (7x + 8) + (5x + 2) = 180. Combine: 19x + 9 = 180, so 19x = 171 and <b>x = 9<\/b>.", "show": "9", "svg": "c5_2", "num": "Ex 5.2", "sec": 0}, {"t": "text", "q": "<b>Notes Example 5.3.<\/b> Solve for x.", "accept": ["12"], "steps": "The right angle is 90: 90 + (2x + 1) + (5x + 5) = 180. So 7x + 96 = 180, 7x = 84 and <b>x = 12<\/b>.", "show": "12", "svg": "c5_3", "num": "Ex 5.3", "sec": 0}, {"t": "text", "q": "<b>Notes Example 6.1.<\/b> Exterior angle (3x &minus; 9)&deg;; remote interior angles 73&deg; and x&deg;. Solve for x.", "accept": ["41"], "steps": "Exterior angle = sum of the remote angles: 3x &minus; 9 = 73 + x. So 2x = 82 and <b>x = 41<\/b>.", "show": "41", "svg": "c6_1", "num": "Ex 6.1 (x)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 6.1.<\/b> Now find the measure of &ang;DCB (the exterior angle, 3x &minus; 9 with x = 41).", "accept": ["114"], "steps": "3(41) &minus; 9 = 123 &minus; 9 = <b>114&deg;<\/b>. Check: 73 + 41 = 114.", "show": "114", "svg": "c6_1", "num": "Ex 6.1 (&ang;DCB)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 6.2.<\/b> Exterior angle (3x + 16)&deg;; remote interior angles 52&deg; and 2x&deg;. Solve for x.", "accept": ["36"], "steps": "3x + 16 = 52 + 2x, so <b>x = 36<\/b>.", "show": "36", "svg": "c6_2", "num": "Ex 6.2 (x)", "sec": 0}, {"t": "text", "q": "<b>Notes Example 6.2.<\/b> Find the exterior angle &ang;DCB and then the interior angle &ang;1 at C. (Give the interior angle &ang;1.)", "accept": ["56"], "steps": "Exterior = 3(36) + 16 = 124&deg;. The interior angle at C is its linear pair: 180 &minus; 124 = <b>56&deg;<\/b>. Check: 52 + 72 + 56 = 180.", "show": "56", "svg": "c6_2", "num": "Ex 6.2 (&ang;1)", "sec": 0}, {"t": "mc", "q": "<b>Notes.<\/b> Complete: The Exterior Angle Theorem says the measure of an exterior angle of a triangle is ______ to the measures of the two ______ interior angles.", "opts": ["half; adjacent", "equal; non-adjacent", "supplementary; non-adjacent", "equal; adjacent"], "ans": 1, "steps": "The exterior angle <b>equals<\/b> the sum of the two <b>non-adjacent<\/b> (remote) interior angles.", "num": "Notes", "sec": 0}, {"t": "mc", "q": "<b>Notes.<\/b> Complete: The Triangle Sum Theorem says the sum of the measures of the ______ angles of a triangle is ______.", "opts": ["interior; 360&deg;", "exterior; 360&deg;", "interior; 180&deg;", "exterior; 180&deg;"], "ans": 2, "steps": "The three <b>interior<\/b> angles add to <b>180&deg;<\/b>.", "num": "Notes", "sec": 0}]}, {"title": "Classifying triangles: more practice", "note": "Name the triangle from its angle measures or its side lengths.", "probs": [{"t": "mc", "q": "A triangle has angles 35&deg;, 55&deg; and 90&deg;. Classify it by its angles.", "opts": ["Obtuse", "Equiangular", "Acute", "Right"], "ans": 3, "steps": "35 + 55 + 90 = 180. One angle is exactly 90&deg;: <b>right<\/b>.", "num": "By angles 1", "sec": 0}, {"t": "mc", "q": "A triangle has angles 60&deg;, 60&deg; and 60&deg;. Classify it by its angles.", "opts": ["Equiangular", "Acute", "Right", "Obtuse"], "ans": 0, "steps": "60 + 60 + 60 = 180. All three angles are 60&deg;: <b>equiangular<\/b>.", "num": "By angles 2", "sec": 0}, {"t": "mc", "q": "A triangle has angles 25&deg;, 40&deg; and 115&deg;. Classify it by its angles.", "opts": ["Equiangular", "Obtuse", "Acute", "Right"], "ans": 1, "steps": "25 + 40 + 115 = 180. 115&deg; is more than 90&deg;: <b>obtuse<\/b>.", "num": "By angles 3", "sec": 0}, {"t": "mc", "q": "A triangle has angles 70&deg;, 50&deg; and 60&deg;. Classify it by its angles.", "opts": ["Right", "Obtuse", "Acute", "Equiangular"], "ans": 2, "steps": "70 + 50 + 60 = 180. Every angle is less than 90&deg;: <b>acute<\/b>.", "num": "By angles 4", "sec": 0}, {"t": "mc", "q": "A triangle has angles 20&deg;, 80&deg; and 80&deg;. Classify it by its angles.", "opts": ["Equiangular", "Right", "Obtuse", "Acute"], "ans": 3, "steps": "20 + 80 + 80 = 180. Every angle is less than 90&deg;: <b>acute<\/b>.", "num": "By angles 5", "sec": 0}, {"t": "mc", "q": "A triangle has angles 45&deg;, 45&deg; and 90&deg;. Classify it by its angles.", "opts": ["Right", "Equiangular", "Obtuse", "Acute"], "ans": 0, "steps": "45 + 45 + 90 = 180. One angle is exactly 90&deg;: <b>right<\/b>.", "num": "By angles 6", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 5, 5 and 8. Classify it by its sides.", "opts": ["Scalene", "Isosceles", "Right", "Equilateral"], "ans": 1, "steps": "Sides 5, 5, 8: exactly two match: <b>isosceles<\/b>.", "num": "By sides 1", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 6, 9 and 11. Classify it by its sides.", "opts": ["Isosceles", "Equilateral", "Scalene", "Right"], "ans": 2, "steps": "Sides 6, 9, 11: all different: <b>scalene<\/b>.", "num": "By sides 2", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 9, 9 and 9. Classify it by its sides.", "opts": ["Scalene", "Right", "Isosceles", "Equilateral"], "ans": 3, "steps": "Sides 9, 9, 9: all three match: <b>equilateral<\/b>.", "num": "By sides 3", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 12, 7 and 12. Classify it by its sides.", "opts": ["Isosceles", "Scalene", "Right", "Equilateral"], "ans": 0, "steps": "Sides 12, 7, 12: exactly two match: <b>isosceles<\/b>.", "num": "By sides 4", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 13, 14 and 15. Classify it by its sides.", "opts": ["Equilateral", "Scalene", "Right", "Isosceles"], "ans": 1, "steps": "Sides 13, 14, 15: all different: <b>scalene<\/b>.", "num": "By sides 5", "sec": 0}]}, {"title": "Triangle Sum and Exterior Angle practice", "note": "Set up the equation, solve for x, then check that the angles make sense.", "probs": [{"t": "text", "q": "The angles of a triangle measure 44&deg;, (3x + 12)&deg; and (3x + 64)&deg;. Find x.", "accept": ["10"], "steps": "44 + (3x + 12) + (3x + 64) = 180. Combine like terms: 6x + 120 = 180. Solve: <b>x = 10<\/b>.", "show": "10", "num": "Sum 1", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 47&deg;, (4x − 10)&deg; and (3x + 87)&deg;. Find x.", "accept": ["8"], "steps": "47 + (4x − 10) + (3x + 87) = 180. Combine like terms: 7x + 124 = 180. Solve: <b>x = 8<\/b>.", "show": "8", "num": "Sum 2", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 58&deg;, (2x)&deg; and (3x + 87)&deg;. Find x.", "accept": ["7"], "steps": "58 + (2x) + (3x + 87) = 180. Combine like terms: 5x + 145 = 180. Solve: <b>x = 7<\/b>.", "show": "7", "num": "Sum 3", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 69&deg;, (2x − 9)&deg; and (3x + 90)&deg;. Find x.", "accept": ["6"], "steps": "69 + (2x − 9) + (3x + 90) = 180. Combine like terms: 5x + 150 = 180. Solve: <b>x = 6<\/b>.", "show": "6", "num": "Sum 4", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 43&deg;, (4x + 5)&deg; and (2x + 72)&deg;. Find x.", "accept": ["10"], "steps": "43 ]}, {"title": "Isosceles and equilateral algebra", "note": "Find which sides (or angles) match, set them equal, and solve.", "probs": [{"t": "text", "q": "&Delta;XYZ is isosceles with vertex angle X. XY = 5x &minus; 3, YZ = 3x + 7 and XZ = 4x + 1. Find x.", "accept": ["4"], "steps": "The legs are XY and XZ (they meet at the vertex X): 5x &minus; 3 = 4x + 1, so <b>x = 4<\/b>. (Quiz review 14 asks for the perimeter too.)", "show": "4", "num": "Isosceles 1", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 3x + 5 and QR = 5x &minus; 7. Find x.", "accept": ["6"], "steps": "The legs PQ and QR are equal: 3x + 5 = 5x &minus; 7. Solve: <b>x = 6<\/b>.", "show": "6", "num": "Isosceles 2", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 4x &minus; 1 and QR = 2x + 9. Find x.", "accept": ["5"], "steps": "The legs PQ and QR are equal: 4x &minus; 1 = 2x + 9. Solve: <b>x = 5<\/b>.", "show": "5", "num": "Isosceles 3", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 7x &minus; 4 and QR = 3x + 12. Find x.", "accept": ["4"], "steps": "The legs PQ and QR are equal: 7x &minus; 4 = 3x + 12. Solve: <b>x = 4<\/b>.", "show": "4", "num": "Isosceles 4", "sec": 0}, {"t": "text", "q": "An isosceles triangle has a vertex angle of 40&deg;. How large is each base angle? (just the number)", "accept": ["70"], "steps": "The base angles are equal and the three angles add to 180: 180 &minus; 40 = 140, and 140 &divide; 2 = <b>70&deg;<\/b>.", "show": "70", "num": "Base angles 1", "sec": 0}, {"t": "text", "q": "An isosceles triangle has a base angle of 50&deg;. How large is the vertex angle? (just the number)", "accept": ["80"], "steps": "The two base angles are 50 + 50 = 100, so the vertex angle is 180 &minus; 100 = <b>80&deg;<\/b>.", "show": "80", "num": "Vertex angle 1", "sec": 0}, {"t": "text", "q": "The angles of an equiangular triangle are each (4x &minus; 20)&deg;. Find x.", "accept": ["20"], "steps": "Each angle of an equiangular triangle is 60&deg;: 4x &minus; 20 = 60, so 4x = 80 and <b>x = 20<\/b>. (Quiz review 7.)", "show": "20", "num": "Equiangular 1", "sec": 0}, {"t": "text", "q": "An equilateral triangle has sides 3x + 8 and 5x &minus; 2. Find x.", "accept": ["5"], "steps": "All sides are equal, so 3x + 8 = 5x &minus; 2. Then 10 = 2x and <b>x = 5<\/b>. (Quiz review 9.)", "show": "5", "num": "Equilateral 1", "sec": 0}, {"t": "text", "q": "An equilateral triangle has a side of 2x + 1 and another side of x + 6. Find x, then the perimeter. (Give the perimeter.)", "accept": ["33"], "steps": "2x + 1 = x + 6 gives x = 5, so each side is 11. Perimeter = 3(11) = <b>33<\/b>.", "show": "33", "num": "Equilateral 2", "sec": 0}]}, {"title": "Classifying on a coordinate plane", "note": "Distance formula for the sides; the squares of the sides (or slopes) tell you if it is a right triangle.", "probs": [{"t": "mc", "q": "Triangle PQR has P(0, 0), Q(4, 0), R(2, 5). Use the distance formula to classify it by its sides.", "opts": ["Scalene", "Equilateral", "Isosceles", "Right"], "ans": 2, "steps": "Distances: PQ = 4, QR = &radic;29, RP = &radic;29. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 16, 29, 29: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Coordinates 1", "sec": 0}, {"t": "tf", "q": "Triangle PQR with P(0, 0), Q(4, 0), R(2, 5) is a right triangle.", "opts": ["True", "False"], "ans": 1, "steps": "Distances: PQ = 4, QR = &radic;29, RP = &radic;29. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 16, 29, 29: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Right? 1", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(1, 1), Q(1, 6), R(5, 1). Use the distance formula to classify it by its sides.", "opts": ["Right", "Equilateral", "Isosceles", "Scalene"], "ans": 3, "steps": "Distances: PQ = 5, QR = &radic;41, RP = 4. All different: scalene. The squares 16 + 25 = 41 add up as a&sup2; + b&sup2; = c&sup2;, so it is a <b>right<\/b> triangle.", "num": "Coordinates 2", "sec": 0}, {"t": "tf", "q": "Triangle PQR with P(1, 1), Q(1, 6), R(5, 1) is a right triangle.", "opts": ["True", "False"], "ans": 0, "steps": "Distances: PQ = 5, QR = &radic;41, RP = 4. All different: scalene. The squares 16 + 25 = 41 add up as a&sup2; + b&sup2; = c&sup2;, so it is a <b>right<\/b> triangle.", "num": "Right? 2", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(0, 0), Q(6, 2), R(2, 6). Use the distance formula to classify it by its sides.", "opts": ["Isosceles", "Equilateral", "Scalene", "Right"], "ans": 0, "steps": "Distances: PQ = 2&radic;10, QR = 4&radic;2, RP = 2&radic;10. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 32, 40, 40: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Coordinates 3", "sec": 0}, {"t": "tf", "q": "Triangle PQR with P(0, 0), Q(6, 2), R(2, 6) is a right triangle.", "opts": ["True", "False"], "ans": 1, "steps": "Distances: PQ = 2&radic;10, QR = 4&radic;2, RP = 2&radic;10. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 32, 40, 40: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Right? 3", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(−2, 1), Q(2, 1), R(0, −3). Use the distance formula to classify it by its sides.", "opts": ["Scalene", "Isosceles", "Right", "Equilateral"], "ans": 1, "steps": "Distances: PQ = 4, QR = 2&radic;5, RP = 2&radic;5. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 16, 20, 20: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Coordinates 4", "sec": 0}, {"t": "tf", "q": "Triangle PQR with P(−2, 1), Q(2, 1), R(0, −3) is a right triangle.", "opts": ["True", "False"], "ans": 1, "steps": "Distances: PQ = 4, QR = 2&radic;5, RP = 2&radic;5. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 16, 20, 20: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Right? 4", "sec": 0}]}], "new": true, "short": "4.1"}, {"id": "4.2", "title": "Congruence and Triangles", "blurb": "Congruent figures, corresponding parts, naming congruent polygons, finding missing measures and variables, the Third Angles Theorem, and proofs with the definition of congruent triangles.", "topics": [{"h": "Congruent figures and corresponding parts", "body": "<p><b>Congruent polygons<\/b> have congruent <b>corresponding parts<\/b>: their matching <b>angles<\/b> and <b>sides<\/b>. Same size and same shape.<\/p>\n<p>When you <b>name<\/b> congruent polygons, you must list the <b>corresponding parts in the same order<\/b>. The letters tell you what matches what.<\/p>\n<table class=\"tbl\"><tr><th>ABCD &cong; MNPQ<\/th><th>Corresponding angles<\/th><th>Corresponding sides<\/th><\/tr>\n<tr><td>1st letters<\/td><td>&ang;A &cong; &ang;M<\/td><td>(sides use two letters)<\/td><\/tr>\n<tr><td>2nd letters<\/td><td>&ang;B &cong; &ang;N<\/td><td>AB &cong; MN<\/td><\/tr>\n<tr><td>3rd letters<\/td><td>&ang;C &cong; &ang;P<\/td><td>BC &cong; NP<\/td><\/tr>\n<tr><td>4th letters<\/td><td>&ang;D &cong; &ang;Q<\/td><td>CD &cong; PQ and DA &cong; QM<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Trick:<\/b> line the two names up, one above the other. Letters in the same position are corresponding vertices. A side is two vertices in a row (and the last one wraps back to the first).<\/div>", "check": {"t": "mc", "q": "ABCD &cong; MNPQ. Which side is congruent to BC?", "opts": ["PQ", "MP", "NP", "MN"], "ans": 2, "steps": "B is the 2nd letter and C is the 3rd. The 2nd and 3rd letters of MNPQ are N and P, so BC &cong; <b>NP<\/b>."}}, {"h": "Reading a congruence statement", "body": "<p>The order of the letters is everything. If &Delta;MKL &cong; &Delta;JET:<\/p>\n<table class=\"tbl\"><tr><th>Vertices<\/th><th>Angles<\/th><th>Sides<\/th><\/tr>\n<tr><td>M &harr; J<\/td><td>&ang;M &cong; &ang;J<\/td><td>MK &cong; JE<\/td><\/tr>\n<tr><td>K &harr; E<\/td><td>&ang;K &cong; &ang;E<\/td><td>KL &cong; ET<\/td><\/tr>\n<tr><td>L &harr; T<\/td><td>&ang;L &cong; &ang;T<\/td><td>LM &cong; TJ<\/td><\/tr><\/table>\n<p>Then if m&ang;K = 32&deg;, m&ang;E = 32&deg;; if JT = 6 cm, ML = 6 cm. You can also <b>rewrite<\/b> the statement in another order as long as the pairs stay matched: &Delta;ETJ &cong; &Delta;KLM (E&harr;K, T&harr;L, J&harr;M).<\/p>\n<div class=\"tip\"><b>Common slip:<\/b> writing &Delta;ABC &cong; &Delta;DFE when the figure says B&harr;E. Match the <i>vertices<\/i> first, then write the names.<\/div>", "check": {"t": "mc", "q": "&Delta;MKL &cong; &Delta;JET. Which angle is congruent to &ang;L?", "opts": ["&ang;E", "&ang;J", "&ang;M", "&ang;T"], "ans": 3, "steps": "L is the 3rd letter of MKL, and the 3rd letter of JET is T. So &ang;L &cong; <b>&ang;T<\/b>."}}, {"h": "Finding missing measures and variables", "body": "<p>Congruent parts have <b>equal measures<\/b>. To find a variable:<\/p>\n<ol><li>Use the congruence statement (or the tick marks and arcs) to find which parts match.<\/li>\n<li>Set the two matching measures <b>equal<\/b>.<\/li>\n<li>Solve for the variable, then plug back in if the question asks for a side or an angle.<\/li><\/ol>\n<p><i>Example.<\/i> &Delta;ABC &cong; &Delta;LMK, with &ang;A = 58&deg;, &ang;B = 74&deg; and &ang;K = (5x &minus; 2)&deg;. First find &ang;C = 180 &minus; (58 + 74) = 48&deg;. C&harr;K, so 5x &minus; 2 = 48 and <b>x = 10<\/b>.<\/p>\n<div class=\"tip\"><b>Two things to remember:<\/b> if an angle is missing, use the <b>Triangle Sum Theorem<\/b> to find it. If you need to match sides to variables (like 2y and 5x), match them through the <i>congruence statement<\/i>, not through where they are drawn.<\/div>", "check": {"t": "text", "q": "&Delta;DEF &cong; &Delta;JKL with DE = 26, EF = 25, JK = 2y and KL = 5x. Find y.", "accept": ["13"], "steps": "D&harr;J and E&harr;K, so DE &cong; JK: 2y = 26 and <b>y = 13<\/b>. (And EF &cong; KL: 5x = 25, so x = 5.)", "show": "13"}}, {"h": "The Third Angles Theorem", "body": "<p><b>Third Angles Theorem.<\/b> If two angles of one triangle are congruent to two angles of another triangle, then the <b>third angles are congruent<\/b>.<\/p>\n<p>Why it works: each triangle has 180&deg;. If two angles match, whatever is left over for the third angle must match too.<\/p>\n<p>Example: if &ang;A &cong; &ang;X and &ang;B &cong; &ang;Y, then <b>&ang;C &cong; &ang;Z<\/b>.<\/p>\n<p>In a proof, this lets you get the <b>third pair of angles<\/b> without any extra measuring. Reason: <b>Third Angles Theorem<\/b>.<\/p>", "check": {"t": "mc", "q": "In &Delta;ABC and &Delta;XYZ, &ang;A &cong; &ang;X and &ang;B &cong; &ang;Y. What does the Third Angles Theorem let you conclude?", "opts": ["&ang;C &cong; &ang;Z", "AB &cong; XY", "&Delta;ABC &cong; &Delta;XYZ", "&ang;C is a right angle"], "ans": 0, "steps": "Two pairs of angles match, so the <b>third pair<\/b>, &ang;C and &ang;Z, must match."}}, {"h": "Proving triangles congruent with the definition", "body": "<p><b>Definition of congruent triangles:<\/b> two triangles are congruent when <b>all three pairs of corresponding sides<\/b> and <b>all three pairs of corresponding angles<\/b> are congruent (six facts in all).<\/p>\n<p><b>Plan for the proofs:<\/b><\/p>\n<ol><li>Write the Given in step 1.<\/li>\n<li>Collect the missing pairs: a <b>shared side<\/b> (Reflexive Property of Congruence), the <b>third angles<\/b> (Third Angles Theorem), a <b>midpoint<\/b> (Definition of midpoint), <b>vertical angles<\/b>, or <b>parallel lines<\/b> (Alternate Interior Angles Theorem).<\/li>\n<li>Last step: the triangles are congruent by the <b>Definition of congruent triangles<\/b>.<\/li><\/ol>\n<div class=\"tip\"><b>Check list:<\/b> before the last step, count your pairs. You need 3 sides and 3 angles, each one from the Given or from a step you proved.<\/div>", "check": {"t": "mc", "q": "What is the reason for the last step of a proof that finishes with &ldquo;&Delta;NMO &cong; &Delta;POM&rdquo;, when all six pairs of parts have been shown congruent?", "opts": ["Reflexive Property of Congruence", "Definition of congruent triangles", "Third Angles Theorem", "Definition of midpoint"], "ans": 1, "steps": "All corresponding sides and angles are congruent, so the triangles are congruent by the <b>Definition of congruent triangles<\/b>."}}], "sets": [{"title": "Class notes 4.2", "note": "Everything from your 4.2 notes and Practice 4.2, with answers from the class key.", "probs": [{"t": "text", "q": "<b>Notes Do Now.<\/b> Find m&ang;YWX. (The exterior angle at Y is (11x &minus; 18)&deg;; the remote interior angles are (3x + 18)&deg; at X and (3x + 14)&deg; at W. Give the number.)", "accept": ["44"], "steps": "Exterior Angle Theorem: 11x &minus; 18 = (3x + 18) + (3x + 14) = 6x + 32. So 5x = 50 and x = 10. Then m&ang;YWX = 3(10) + 14 = <b>44&deg;<\/b>. Check: &ang;X = 48&deg;, &ang;XYW = 180 &minus; 92 = 88&deg;, and 48 + 88 + 44 = 180.", "show": "44", "img": "dn", "num": "Do Now", "sec": 1}, {"t": "mc", "q": "<b>Notes.<\/b> When you name congruent polygons, you must list the ______ in the same order.", "opts": ["vertices alphabetically", "longest sides", "corresponding parts", "acute angles"], "ans": 2, "steps": "The <b>corresponding parts<\/b> must be in the same order so the letters match up.", "num": "Notes", "sec": 1}, {"t": "mc", "q": "<b>Notes.<\/b> ABCD &cong; MNPQ. Which angle is congruent to &ang;C?", "opts": ["&ang;Q", "&ang;N", "&ang;M", "&ang;P"], "ans": 3, "steps": "C is the 3rd letter; the 3rd letter of MNPQ is P. So &ang;C &cong; <b>&ang;P<\/b>.", "num": "Corresp parts (1)", "sec": 1}, {"t": "mc", "q": "<b>Notes.<\/b> ABCD &cong; MNPQ. Which side is congruent to AD?", "opts": ["MQ", "PQ", "MN", "NP"], "ans": 0, "steps": "A and D are the 1st and 4th letters; the 1st and 4th letters of MNPQ are M and Q. So AD &cong; <b>MQ<\/b>.", "num": "Corresp parts (2)", "sec": 1}, {"t": "mc", "q": "<b>Notes 1.<\/b> PQRS &cong; DEFG. Complete: RS &cong; ______.", "opts": ["EF", "FG", "DE", "GD"], "ans": 1, "steps": "R and S are the 3rd and 4th letters; the 3rd and 4th letters of DEFG are F and G. So RS &cong; <b>FG<\/b>.", "num": "Complete 1 (side)", "sec": 1}, {"t": "mc", "q": "<b>Notes 1.<\/b> PQRS &cong; DEFG. Complete: &ang;D &cong; ______.", "opts": ["&ang;R", "&ang;S", "&ang;P", "&ang;Q"], "ans": 2, "steps": "D is the 1st letter of DEFG; the 1st letter of PQRS is P. So &ang;D &cong; <b>&ang;P<\/b>.", "num": "Complete 1 (angle)", "sec": 1}, {"t": "mc", "q": "<b>Notes 2.<\/b> HJKL &cong; MNPQ. Complete: HL &cong; ______.", "opts": ["MN", "NP", "PQ", "MQ"], "ans": 3, "steps": "H and L are the 1st and 4th letters; the 1st and 4th letters of MNPQ are M and Q. So HL &cong; <b>MQ<\/b>.", "num": "Complete 2 (side)", "sec": 1}, {"t": "mc", "q": "<b>Notes 2.<\/b> HJKL &cong; MNPQ. Complete: &ang;K &cong; ______.", "opts": ["&ang;P", "&ang;N", "&ang;Q", "&ang;M"], "ans": 0, "steps": "K is the 3rd letter of HJKL; the 3rd letter of MNPQ is P. So &ang;K &cong; <b>&ang;P<\/b>.", "num": "Complete 2 (angle)", "sec": 1}, {"t": "text", "q": "<b>Notes 3.<\/b> &Delta;ABC &cong; &Delta;LMK. m&ang;A = 58&deg;, m&ang;B = 74&deg;, and m&ang;K = (5x &minus; 2)&deg;. Find x.", "accept": ["10"], "steps": "First &ang;C = 180 &minus; (58 + 74) = 48&deg;. C&harr;K, so 5x &minus; 2 = 48, 5x = 50, <b>x = 10<\/b>.", "show": "10", "img": "v3", "num": "Notes 3", "sec": 1}, {"t": "text", "q": "<b>Notes 4.<\/b> &Delta;DEF &cong; &Delta;JKL. DE = 26, EF = 25, DF = 17, JK = 2y, KL = 5x, JL = 17. Find x.", "accept": ["5"], "steps": "E&harr;K and F&harr;L, so EF &cong; KL: 5x = 25 and <b>x = 5<\/b>.", "show": "5", "img": "v4", "num": "Notes 4 (x)", "sec": 1}, {"t": "text", "q": "<b>Notes 4.<\/b> Same triangles. Find y.", "accept": ["13"], "steps": "D&harr;J and E&harr;K, so DE &cong; JK: 2y = 26 and <b>y = 13<\/b>.", "show": "13", "img": "v4", "num": "Notes 4 (y)", "sec": 1}, {"t": "mc", "q": "<b>Notes.<\/b> If &ang;A &cong; &ang;X and &ang;B &cong; &ang;Y, then &ang;C &cong; &ang;___ (Third Angles Theorem).", "opts": ["B", "Z", "X", "Y"], "ans": 1, "steps": "The third angles of the two triangles are C and Z.", "num": "Third Angles blank", "sec": 1}, {"t": "proof", "q": "<b>Notes proof.<\/b> Prove the Third Angles Theorem. Given: &ang;A &cong; &ang;X, &ang;B &cong; &ang;Y. Prove: &ang;C &cong; &ang;Z.", "rows": [{"s": "∠A ≅ ∠X, ∠B ≅ ∠Y", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "m∠A = m∠X, m∠B = m∠Y", "r": ["Definition of congruent angles", "Definition of congruence"], "why": "Congruent angles have equal measures.", "fixed": false}, {"s": "m∠A + m∠B + m∠C = 180 and m∠X + m∠Y + m∠Z = 180", "r": ["Triangle Sum Theorem"], "why": "The angles of each triangle add to 180&deg;.", "fixed": false}, {"s": "m∠A + m∠B + m∠C = m∠X + m∠Y + m∠Z", "r": ["Transitive Property of Equality", "Substitution Property of Equality"], "why": "Both sums equal 180.", "fixed": false}, {"s": "m∠X + m∠Y + m∠C = m∠X + m∠Y + m∠Z", "r": ["Substitution Property of Equality", "Transitive Property of Equality"], "why": "Replace m&ang;A with m&ang;X and m&ang;B with m&ang;Y using step 2.", "fixed": false}, {"s": "m∠C = m∠Z", "r": ["Subtraction Property of Equality"], "why": "Subtract m&ang;X + m&ang;Y from both sides.", "fixed": false}, {"s": "∠C ≅ ∠Z", "r": ["Definition of congruent angles", "Definition of congruence"], "why": "Equal measures mean congruent angles.", "fixed": false}], "steps": "Pattern: write each triangle&rsquo;s 180&deg; sum, set them equal, then cancel the two angle pairs you already know.", "num": "Third Angles proof", "sec": 1}, {"t": "proof", "q": "<b>Notes proof 1.<\/b> Given: &ang;MNO &cong; &ang;OPM, &ang;NMO &cong; &ang;POM, NO &cong; MP, NM &cong; OP. Prove: &Delta;NMO &cong; &Delta;POM.", "rows": [{"s": "∠MNO ≅ ∠OPM, ∠NMO ≅ ∠POM, NO ≅ MP, NM ≅ OP", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "MO ≅ MO", "r": ["Reflexive Property of Congruence"], "why": "MO is a side of both triangles (the shared side).", "fixed": false}, {"s": "∠NOM ≅ ∠PMO", "r": ["Third Angles Theorem"], "why": "Two pairs of angles match, so the third pair matches.", "fixed": false}, {"s": "ΔNMO ≅ ΔPOM", "r": ["Definition of congruent triangles"], "why": "All three pairs of sides and all three pairs of angles are congruent.", "fixed": false}], "steps": "You have four of the six pairs in the Given. Get the shared side and the third angle pair, then finish with the definition.", "img": "qp1", "num": "Notes proof 1", "sec": 1}, {"t": "proof", "q": "<b>Notes proof 2.<\/b> Given: AB &#8741; DC, AB &cong; DC, E is the midpoint of AC and BD. Prove: &Delta;AEB &cong; &Delta;CED.<br><b>Key note:<\/b> the printed Given says &ldquo;midpoint of AD and BC&rdquo;; the diagonals are <b>AC and BD<\/b>, and the key fixes it by hand (as written here).", "rows": [{"s": "AB ∥ DC, AB ≅ DC, E is the midpoint of AC and BD", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "AE ≅ EC and BE ≅ ED", "r": ["Definition of midpoint"], "why": "A midpoint splits a segment into two congruent parts.", "fixed": false}, {"s": "∠BAE ≅ ∠DCE, ∠ABE ≅ ∠CDE", "r": ["Alternate Interior Angles Theorem"], "why": "AB &#8741; DC, and AC and BD are transversals.", "fixed": false}, {"s": "∠AEB ≅ ∠DEC", "r": ["Vertical Angles Congruence Theorem"], "why": "AC and BD cross at E.", "fixed": false}, {"s": "ΔAEB ≅ ΔCED", "r": ["Definition of congruent triangles"], "why": "Sides: AB &cong; CD, AE &cong; CE, BE &cong; DE. Angles: A &cong; C, B &cong; D, E &cong; E (vertical).", "fixed": false}], "steps": "Parallel lines give the two pairs of alternate interior angles, the midpoint gives two pairs of sides, vertical angles give the third angle pair.", "img": "qp2", "num": "Notes proof 2", "sec": 1}, {"t": "mc", "q": "<b>Practice A.<\/b> Given &Delta;MKL &cong; &Delta;JET: &ang;L &cong; ______.", "opts": ["&ang;J", "&ang;E", "&ang;T", "&ang;K"], "ans": 2, "steps": "M&harr;J, K&harr;E, L&harr;T. So &ang;L &cong; <b>&ang;T<\/b>.", "img": "pa", "num": "Practice A", "sec": 1}, {"t": "mc", "q": "<b>Practice B.<\/b> Given &Delta;MKL &cong; &Delta;JET: MK &cong; ______.", "opts": ["JT", "ET", "KE", "JE"], "ans": 3, "steps": "M&harr;J and K&harr;E, so MK &cong; <b>JE<\/b>.", "img": "pa", "num": "Practice B", "sec": 1}, {"t": "text", "q": "<b>Practice C.<\/b> Given &Delta;MKL &cong; &Delta;JET, with m&ang;K = 32&deg; in &Delta;MKL. m&ang;E = ______ (just the number).", "accept": ["32"], "steps": "K&harr;E, so m&ang;E = m&ang;K = <b>32&deg;<\/b>.", "show": "32", "img": "pa", "num": "Practice C", "sec": 1}, {"t": "text", "q": "<b>Practice D.<\/b> Given &Delta;MKL &cong; &Delta;JET, with JT = 6 cm. ML = ______ (just the number).", "accept": ["6"], "steps": "M&harr;J and L&harr;T, so ML &cong; JT = <b>6 cm<\/b>.", "show": "6", "img": "pa", "num": "Practice D", "sec": 1}, {"t": "mc", "q": "<b>Practice E.<\/b> Given &Delta;MKL &cong; &Delta;JET: &Delta;ETJ &cong; ______.", "opts": ["&Delta;KLM", "&Delta;KML", "&Delta;MKL", "&Delta;LKM"], "ans": 0, "steps": "E&harr;K, T&harr;L, J&harr;M, so &Delta;ETJ &cong; <b>&Delta;KLM<\/b>.", "img": "pa", "num": "Practice E", "sec": 1}, {"t": "mc", "q": "<b>Practice F.<\/b> Given &Delta;MKL &cong; &Delta;JET: &ang;JTE &cong; ______.", "opts": ["&ang;MKL", "&ang;MLK", "&ang;KML", "&ang;LMK"], "ans": 1, "steps": "J&harr;M, T&harr;L, E&harr;K, so &ang;JTE (vertex T) &cong; the angle at L: <b>&ang;MLK<\/b>.", "img": "pa", "num": "Practice F", "sec": 1}, {"t": "mc", "q": "<b>Practice 1.<\/b> The two triangles in the figure are congruent (A&harr;D, B&harr;C, G&harr;F). Write a congruence statement.", "opts": ["&Delta;AGB &cong; &Delta;DCF", "&Delta;ABG &cong; &Delta;DFC", "&Delta;ABG &cong; &Delta;DCF", "&Delta;ABG &cong; &Delta;CDF"], "ans": 2, "steps": "List the corresponding vertices in the same order: A, B, G match D, C, F. So <b>&Delta;ABG &cong; &Delta;DCF<\/b>.", "img": "p1", "num": "Practice 1", "sec": 1}, {"t": "text", "q": "<b>Practice 2.<\/b> Find x. (The two angles marked (17x &minus; y)&deg; and (12x + 4y)&deg; are congruent to 50&deg; and 40&deg;; use 17x &minus; y = 50 and 12x + 4y = 40.)", "accept": ["3"], "steps": "From the first equation y = 17x &minus; 50. Substitute: 12x + 4(17x &minus; 50) = 40, so 80x &minus; 200 = 40 and 80x = 240. <b>x = 3<\/b>.", "show": "3", "img": "p2", "num": "Practice 2 (x)", "sec": 1}, {"t": "text", "q": "<b>Practice 2.<\/b> Same system: 17x &minus; y = 50 and 12x + 4y = 40. Find y.", "accept": ["1"], "steps": "With x = 3: y = 17(3) &minus; 50 = 51 &minus; 50 = <b>1<\/b>. Check: 12(3) + 4(1) = 40.", "show": "1", "img": "p2", "num": "Practice 2 (y)", "sec": 1}, {"t": "text", "q": "<b>Practice 3.<\/b> &Delta;ABC has m&ang;A = 45&deg; and m&ang;B = 80&deg;. It is congruent to &Delta;SQR, and m&ang;R = 5x&deg; corresponds to &ang;C. Find x.", "accept": ["11"], "steps": "&ang;C = 180 &minus; (45 + 80) = 55&deg;. So 5x = 55 and <b>x = 11<\/b>.", "show": "11", "img": "p3", "num": "Practice 3", "sec": 1}]}, {"title": "Homework 4 (Congruent Triangles)", "note": "All twelve problems from the 4.2 homework, with the key checked. One key answer is wrong: HW 5e.", "probs": [{"t": "mc", "q": "<b>HW 1.<\/b> Which is a valid congruence statement for the two triangles?", "opts": ["&Delta;PTW &cong; &Delta;DGH", "&Delta;PWT &cong; &Delta;HGD", "&Delta;PTW &cong; &Delta;HDG", "&Delta;PTW &cong; &Delta;HGD"], "ans": 3, "steps": "The key matches PW &cong; HD, PT &cong; HG, TW &cong; GD, &ang;P &cong; &ang;H, &ang;T &cong; &ang;G, &ang;W &cong; &ang;D. So P&harr;H, T&harr;G, W&harr;D: <b>&Delta;PTW &cong; &Delta;HGD<\/b>.", "img": "h1", "num": "HW 1", "sec": 1}, {"t": "mc", "q": "<b>HW 2.<\/b> &Delta;ABE &cong; &Delta;MNP. Which angle is congruent to &ang;E?", "opts": ["&ang;P", "&ang;B", "&ang;N", "&ang;M"], "ans": 0, "steps": "E is the 3rd letter; the 3rd letter of MNP is P. So &ang;E &cong; <b>&ang;P<\/b>.", "num": "HW 2 (angle)", "sec": 1}, {"t": "mc", "q": "<b>HW 2.<\/b> &Delta;ABE &cong; &Delta;MNP. Which side is congruent to BE?", "opts": ["MN", "NP", "PM", "MP"], "ans": 1, "steps": "B and E are the 2nd and 3rd letters; N and P are the 2nd and 3rd of MNP. So BE &cong; <b>NP<\/b>.", "num": "HW 2 (side)", "sec": 1}, {"t": "mc", "q": "<b>HW 2.<\/b> &Delta;ABE &cong; &Delta;MNP. Which is another valid congruence statement?", "opts": ["&Delta;EBA &cong; &Delta;MNP", "&Delta;AEB &cong; &Delta;MNP", "&Delta;BAE &cong; &Delta;NMP", "&Delta;BAE &cong; &Delta;MNP"], "ans": 2, "steps": "Swap A and B on the left and swap M and N on the right. The pairs stay matched: <b>&Delta;BAE &cong; &Delta;NMP<\/b>.", "num": "HW 2 (other)", "sec": 1}, {"t": "mc", "q": "<b>HW 3.<\/b> &Delta;QRY &cong; &Delta;JLS. Which angle is congruent to &ang;Y?", "opts": ["&ang;R", "&ang;L", "&ang;J", "&ang;S"], "ans": 3, "steps": "Y is the 3rd letter; the 3rd letter of JLS is S. So &ang;Y &cong; <b>&ang;S<\/b>.", "num": "HW 3 (angle)", "sec": 1}, {"t": "mc", "q": "<b>HW 3.<\/b> &Delta;QRY &cong; &Delta;JLS. Which side is congruent to RY?", "opts": ["LS", "SJ", "JL", "JS"], "ans": 0, "steps": "R and Y are the 2nd and 3rd letters; L and S are the 2nd and 3rd of JLS. So RY &cong; <b>LS<\/b>.", "num": "HW 3 (side)", "sec": 1}, {"t": "mc", "q": "<b>HW 4.<\/b> &Delta;STU &cong; &Delta;KLM. Which side is congruent to TU?", "opts": ["MU", "LM", "KM", "KL"], "ans": 1, "steps": "T and U are the 2nd and 3rd letters; L and M are the 2nd and 3rd of KLM. So TU &cong; <b>LM<\/b>.", "num": "HW 4a", "sec": 1}, {"t": "mc", "q": "<b>HW 4.<\/b> &Delta;STU &cong; &Delta;KLM. Which side is congruent to KM?", "opts": ["SK", "TU", "SU", "ST"], "ans": 2, "steps": "K and M are the 1st and 3rd letters of KLM; S and U are the 1st and 3rd of STU. So KM &cong; <b>SU<\/b>.", "num": "HW 4b", "sec": 1}, {"t": "mc", "q": "<b>HW 4.<\/b> &Delta;STU &cong; &Delta;KLM. Which angle is congruent to &ang;M?", "opts": ["&ang;T", "&ang;S", "&ang;L", "&ang;U"], "ans": 3, "steps": "M is the 3rd letter, so it matches the 3rd letter of STU: <b>&ang;U<\/b>.", "num": "HW 4d", "sec": 1}, {"t": "mc", "q": "<b>HW 4.<\/b> &Delta;STU &cong; &Delta;KLM. Which is a valid statement?", "opts": ["&Delta;UST &cong; &Delta;MKL", "&Delta;TUS &cong; &Delta;MKL", "&Delta;UST &cong; &Delta;KLM", "&Delta;UTS &cong; &Delta;MKL"], "ans": 0, "steps": "U, S, T matches M, K, L (U&harr;M, S&harr;K, T&harr;L). So <b>&Delta;UST &cong; &Delta;MKL<\/b>.", "num": "HW 4g", "sec": 1}, {"t": "text", "q": "<b>HW 5a.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find CM = ______ m", "accept": ["11"], "steps": "&Delta;BCM &cong; &Delta;ZYR, so CM &cong; YR = <b>11 m<\/b>.", "show": "11", "img": "h5", "num": "HW 5a", "sec": 1}, {"t": "text", "q": "<b>HW 5b.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find BM = ______ m", "accept": ["15"], "steps": "BM &cong; ZR = <b>15 m<\/b>.", "show": "15", "img": "h5", "num": "HW 5b", "sec": 1}, {"t": "text", "q": "<b>HW 5c.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find YZ = ______ m", "accept": ["8"], "steps": "YZ &cong; CB = <b>8 m<\/b>.", "show": "8", "img": "h5", "num": "HW 5c", "sec": 1}, {"t": "text", "q": "<b>HW 5d.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find m&ang;B = ______&deg;", "accept": ["45"], "steps": "&ang;B &cong; &ang;Z = <b>45&deg;<\/b>.", "show": "45", "img": "h5", "num": "HW 5d", "sec": 1}, {"t": "text", "q": "<b>HW 5e.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find m&ang;M = ______&deg;", "accept": ["32"], "steps": "&ang;M &cong; &ang;R, and &ang;R = 180 &minus; (103 + 45) = 180 &minus; 148 = <b>32&deg;<\/b>.<br><b>Key error:<\/b> the HW key writes 180 &minus; (103 + 45) = 180 &minus; 151 = 29&deg;. But 103 + 45 = 148, so the answer is 32&deg;, not 29&deg;.", "show": "32", "img": "h5", "num": "HW 5e", "sec": 1}, {"t": "text", "q": "<b>HW 5f.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find m&ang;Y = ______&deg;", "accept": ["103"], "steps": "&ang;Y &cong; &ang;C = <b>103&deg;<\/b>.", "show": "103", "img": "h5", "num": "HW 5f", "sec": 1}, {"t": "text", "q": "<b>HW 6a.<\/b> Given &Delta;ACP &cong; &Delta;LNX, with AP = 13 cm. Find XL (just the number). (A&harr;L, C&harr;N, P&harr;X.)", "accept": ["13"], "steps": "AP and LX are corresponding (A&harr;L, P&harr;X), so XL = <b>13 cm<\/b>.", "show": "13", "img": "h6", "num": "HW 6a", "sec": 1}, {"t": "text", "q": "<b>HW 6f.<\/b> Given &Delta;ACP &cong; &Delta;LNX with m&ang;A = 29&deg; and m&ang;C = 29&deg;. Find m&ang;X (just the number).", "accept": ["122"], "steps": "&ang;P = 180 &minus; (29 + 29) = 180 &minus; 58 = 122&deg;. P&harr;X, so m&ang;X = <b>122&deg;<\/b>.", "show": "122", "img": "h6", "num": "HW 6f", "sec": 1}, {"t": "text", "q": "<b>HW 7.<\/b> &Delta;XPS &cong; &Delta;DNF. XP = 4y &minus; 3 and DN = 57. Find y.", "accept": ["15"], "steps": "XP &cong; DN: 4y &minus; 3 = 57, 4y = 60, <b>y = 15<\/b>.", "show": "15", "img": "h7", "num": "HW 7 (y)", "sec": 1}, {"t": "text", "q": "<b>HW 7.<\/b> &Delta;XPS &cong; &Delta;DNF. XS = 17x + 3 and DF = 54. Find x.", "accept": ["3"], "steps": "XS &cong; DF: 17x + 3 = 54, 17x = 51, <b>x = 3<\/b>.", "show": "3", "img": "h7", "num": "HW 7 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 8.<\/b> &Delta;MTW &cong; &Delta;BGK. m&ang;T = (4x &minus; 3)&deg; corresponds to &ang;G = 45&deg;. Find x.", "accept": ["12"], "steps": "T&harr;G: 4x &minus; 3 = 45, 4x = 48, <b>x = 12<\/b>.", "show": "12", "img": "h8", "num": "HW 8 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 8.<\/b> &Delta;MTW &cong; &Delta;BGK. In &Delta;MTW, m&ang;T = 45&deg; and m&ang;W = 41&deg;. m&ang;B = (11y + 6)&deg;. Find y.", "accept": ["8"], "steps": "&ang;M = 180 &minus; (45 + 41) = 94&deg;. M&harr;B, so 11y + 6 = 94, 11y = 88, <b>y = 8<\/b>.", "show": "8", "img": "h8", "num": "HW 8 (y)", "sec": 1}, {"t": "text", "q": "<b>HW 9.<\/b> &Delta;PRS &cong; &Delta;CFH. PS = 2x &minus; 7 and CH = 39. Find x.", "accept": ["23"], "steps": "P&harr;C and S&harr;H, so PS &cong; CH: 2x &minus; 7 = 39, 2x = 46, <b>x = 23<\/b>.", "show": "23", "img": "h9", "num": "HW 9 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 9.<\/b> &Delta;PRS &cong; &Delta;CFH. &ang;F is a right angle and m&ang;R = (13y &minus; 1)&deg;. Find y.", "accept": ["7"], "steps": "R&harr;F, so m&ang;R = 90: 13y &minus; 1 = 90, 13y = 91, <b>y = 7<\/b>.", "show": "7", "img": "h9", "num": "HW 9 (y)", "sec": 1}, {"t": "text", "q": "<b>HW 9.<\/b> &Delta;PRS &cong; &Delta;CFH. m&ang;S = 62&deg; (since m&ang;P = 28&deg; and m&ang;R = 90&deg;) and m&ang;H = (6z &minus; 4)&deg;. Find z.", "accept": ["11"], "steps": "S&harr;H: 62 = 6z &minus; 4, 66 = 6z, <b>z = 11<\/b>.", "show": "11", "img": "h9", "num": "HW 9 (z)", "sec": 1}, {"t": "text", "q": "<b>HW 10.<\/b> &Delta;ABC &cong; &Delta;DEF, AB = 8, BC = 19, AC = 14, EF = 4x &minus; 1 and DE = y &minus; 6. Find x.", "accept": ["5"], "steps": "EF &cong; BC: 4x &minus; 1 = 19, 4x = 20, <b>x = 5<\/b>.", "show": "5", "num": "HW 10 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 10.<\/b> Same triangles. Find y.", "accept": ["14"], "steps": "DE &cong; AB: y &minus; 6 = 8, <b>y = 14<\/b>.", "show": "14", "num": "HW 10 (y)", "sec": 1}, {"t": "text", "q": "<b>HW 11.<\/b> &Delta;ZMK &cong; &Delta;APY, m&ang;M = 112&deg;, m&ang;Y = 41&deg;, m&ang;K = (13x &minus; 37)&deg;. Find x.", "accept": ["6"], "steps": "K&harr;Y, so 13x &minus; 37 = 41, 13x = 78, <b>x = 6<\/b>.", "show": "6", "num": "HW 11 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 11.<\/b> Same triangles. m&ang;A = (2y + 7)&deg;. Find y.", "accept": ["10"], "steps": "&ang;Z = 180 &minus; (112 + 41) = 27&deg;. Z&harr;A, so 2y + 7 = 27, 2y = 20, <b>y = 10<\/b>.", "show": "10", "num": "HW 11 (y)", "sec": 1}, {"t": "text", "q": "<b>HW 12.<\/b> &Delta;BTS &cong; &Delta;GHD. BS = 25, TS = 31, GD = 4x &minus; 11. Find x.", "accept": ["9"], "steps": "B&harr;G and S&harr;D, so BS &cong; GD: 25 = 4x &minus; 11, 36 = 4x, <b>x = 9<\/b>.", "show": "9", "num": "HW 12 (x)", "sec": 1}, {"t": "text", "q": "<b>HW 12.<\/b> Same triangles. m&ang;S = 56&deg;, m&ang;B = 21&deg;, m&ang;H = (7y + 5)&deg;. Find y.", "accept": ["14"], "steps": "&ang;T = 180 &minus; (21 + 56) = 103&deg;. T&harr;H, so 7y + 5 = 103, 7y = 98, <b>y = 14<\/b>.", "show": "14", "num": "HW 12 (y)", "sec": 1}]}, {"title": "More corresponding-parts and variable practice", "note": "Match the letters by position, then set matching measures equal.", "probs": [{"t": "mc", "q": "&Delta;ABC &cong; &Delta;YXZ. Which angle is congruent to &ang;A?", "opts": ["&ang;X", "&ang;Y", "&ang;Z", "&ang;B"], "ans": 1, "steps": "A is letter 1 in ABC, so its partner is letter 1 of YXZ: <b>&ang;Y<\/b>.", "num": "Corresp 1", "sec": 1}, {"t": "mc", "q": "&Delta;PQR &cong; &Delta;NLM. Which side is congruent to PQ?", "opts": ["LM", "PQ", "NL", "NM"], "ans": 2, "steps": "Match the letter positions: PQ are letters 1 and 2 of PQR, so they match letters 1 and 2 of NLM: <b>NL<\/b>.", "num": "Corresp 2", "sec": 1}, {"t": "mc", "q": "&Delta;DEF &cong; &Delta;KJH. Which angle is congruent to &ang;F?", "opts": ["&ang;K", "&ang;D", "&ang;J", "&ang;H"], "ans": 3, "steps": "F is letter 3 in DEF, so its partner is letter 3 of KJH: <b>&ang;H<\/b>.", "num": "Corresp 3", "sec": 1}, {"t": "mc", "q": "&Delta;STU &cong; &Delta;WVX. Which side is congruent to TU?", "opts": ["VX", "TU", "WX", "WV"], "ans": 0, "steps": "Match the letter positions: TU are letters 2 and 3 of STU, so they match letters 2 and 3 of WVX: <b>VX<\/b>.", "num": "Corresp 4", "sec": 1}, {"t": "mc", "q": "&Delta;GHI &cong; &Delta;DEC. Which angle is congruent to &ang;G?", "opts": ["&ang;C", "&ang;D", "&ang;E", "&ang;H"], "ans": 1, "steps": "G is letter 1 in GHI, so its partner is letter 1 of DEC: <b>&ang;D<\/b>.", "num": "Corresp 5", "sec": 1}, {"t": "mc", "q": "&Delta;KLM &cong; &Delta;STR. Which side is congruent to KL?", "opts": ["TR", "KL", "ST", "SR"], "ans": 2, "steps": "Match the letter positions: KL are letters 1 and 2 of KLM, so they match letters 1 and 2 of STR: <b>ST<\/b>.", "num": "Corresp 6", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 4x + 9, DE = 25, BC = 3y + 4 and EF = 22. Find x.", "accept": ["4"], "steps": "AB &cong; DE: 4x + 9 = 25, so 4x = 16 and <b>x = 4<\/b>.", "show": "4", "num": "Variables 1 (x)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. BC = 3y + 4 and EF = 22. Find y.", "accept": ["6"], "steps": "BC &cong; EF: 3y + 4 = 22, so 3y = 18 and <b>y = 6<\/b>.", "show": "6", "num": "Variables 1 (y)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 3x + 5, DE = 26, BC = 2y + 3 and EF = 9. Find x.", "accept": ["7"], "steps": "AB &cong; DE: 3x + 5 = 26, so 3x = 21 and <b>x = 7<\/b>.", "show": "7", "num": "Variables 2 (x)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. BC = 2y + 3 and EF = 9. Find y.", "accept": ["3"], "steps": "BC &cong; EF: 2y + 3 = 9, so 2y = 6 and <b>y = 3<\/b>.", "show": "3", "num": "Variables 2 (y)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 4x + 7, DE = 27, BC = 3y + 5 and EF = 32. Find x.", "accept": ["5"], "steps": "AB &cong; DE: 4x + 7 = 27, so 4x = 20 and <b>x = 5<\/b>.", "show": "5", "num": "Variables 3 (x)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. BC = 3y + 5 and EF = 32. Find y.", "accept": ["9"], "steps": "BC &cong; EF: 3y + 5 = 32, so 3y = 27 and <b>y = 9<\/b>.", "show": "9", "num": "Variables 3 (y)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 2x + 4, DE = 20, BC = 3y + 2 and EF = 8. Find x.", "accept": ["8"], "steps": "AB &cong; DE: 2x + 4 = 20, so 2x = 16 and <b>x = 8<\/b>.", "show": "8", "num": "Variables 4 (x)", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. BC = 3y + 2 and EF = 8. Find y.", "accept": ["2"], "steps": "BC &cong; EF: 3y + 2 = 8, so 3y = 6 and <b>y = 2<\/b>.", "show": "2", "num": "Variables 4 (y)", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 50&deg; and m&ang;K = 60&deg;. m&ang;T = (5x)&deg; (T corresponds to L). Find x.", "accept": ["14"], "steps": "&ang;L = 180 &minus; (50 + 60) = 70&deg;. L&harr;T: 5x  = 70, so <b>x = 14<\/b>.", "show": "14", "num": "Angle + x 1", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 35&deg; and m&ang;K = 85&deg;. m&ang;T = (5x &minus; 5)&deg; (T corresponds to L). Find x.", "accept": ["13"], "steps": "&ang;L = 180 &minus; (35 + 85) = 60&deg;. L&harr;T: 5x &minus; 5 = 60, so <b>x = 13<\/b>.", "show": "13", "num": "Angle + x 2", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 48&deg; and m&ang;K = 72&deg;. m&ang;T = (5x)&deg; (T corresponds to L). Find x.", "accept": ["12"], "steps": "&ang;L = 180 &minus; (48 + 72) = 60&deg;. L&harr;T: 5x  = 60, so <b>x = 12<\/b>.", "show": "12", "num": "Angle + x 3", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 40&deg; and m&ang;K = 65&deg;. m&ang;T = (5x &minus; 5)&deg; (T corresponds to L). Find x.", "accept": ["16"], "steps": "&ang;L = 180 &minus; (40 + 65) = 75&deg;. L&harr;T: 5x &minus; 5 = 75, so <b>x = 16<\/b>.", "show": "16", "num": "Angle + x 4", "sec": 1}]}], "new": true, "short": "4.2"}, {"id": "QR", "label": "Quiz review (4.1 and 4.2)", "short": "Quiz review", "title": "Quiz Review Practice", "blurb": "The cheat sheets, how to attack the variable problems, and all 16 quiz review problems with both proofs.", "topics": [{"h": "Cheat sheet: 4.1 in one page", "body": "<table class=\"tbl\"><tr><th>Topic<\/th><th>The rule<\/th><\/tr>\n<tr><td>By sides<\/td><td>Scalene 0 equal &bull; Isosceles at least 2 equal &bull; Equilateral 3 equal<\/td><\/tr>\n<tr><td>By angles<\/td><td>Acute (all &lt; 90&deg;) &bull; Right (one 90&deg;) &bull; Obtuse (one &gt; 90&deg;) &bull; Equiangular (all 60&deg;)<\/td><\/tr>\n<tr><td>Triangle Sum<\/td><td>Interior angles add to <b>180&deg;<\/b><\/td><\/tr>\n<tr><td>Exterior Angle Theorem<\/td><td>Exterior angle = the <b>two remote interior angles<\/b> added<\/td><\/tr>\n<tr><td>Isosceles<\/td><td>Legs equal, base angles equal. The <b>vertex angle<\/b> sits between the legs.<\/td><\/tr>\n<tr><td>Equilateral<\/td><td>All sides equal, every angle <b>60&deg;<\/b><\/td><\/tr>\n<tr><td>On a graph<\/td><td>Distance formula for lengths; <b>opposite reciprocal slopes<\/b> (or a&sup2; + b&sup2; = c&sup2;) for a right angle<\/td><\/tr><\/table>\n<div class=\"tip\"><b>Always / sometimes / never tip:<\/b> equilateral &rarr; always isosceles and acute; a triangle has at most <b>one<\/b> obtuse or right angle; the other two angles are always acute.<\/div>", "check": {"t": "mc", "q": "Which statement about triangles is <b>always<\/b> true?", "opts": ["An equilateral triangle has a right angle", "A scalene triangle is obtuse", "An isosceles triangle is acute", "A right triangle has two acute angles"], "ans": 3, "steps": "The right angle uses 90&deg;, so the other two angles share 90&deg; and are both acute."}}, {"h": "Cheat sheet: 4.2 in one page", "body": "<table class=\"tbl\"><tr><th>Topic<\/th><th>The rule<\/th><\/tr>\n<tr><td>Congruent polygons<\/td><td>All corresponding angles and sides are congruent<\/td><\/tr>\n<tr><td>Naming<\/td><td>List corresponding vertices in the <b>same order<\/b><\/td><\/tr>\n<tr><td>Variables<\/td><td>Set <b>matching<\/b> measures equal and solve<\/td><\/tr>\n<tr><td>Third Angles Theorem<\/td><td>Two pairs of angles match &rarr; the third pair matches<\/td><\/tr>\n<tr><td>Proof tools<\/td><td>Shared side &rarr; Reflexive Property of Congruence &bull; midpoint &rarr; two congruent segments &bull; parallel lines &rarr; alternate interior angles &bull; crossing lines &rarr; vertical angles &bull; finish with the <b>Definition of congruent triangles<\/b><\/td><\/tr><\/table>", "check": {"t": "mc", "q": "Two triangles have two pairs of congruent angles. What is the quickest way to get the third pair?", "opts": ["Third Angles Theorem", "Definition of midpoint", "Exterior Angle Theorem", "Distance formula"], "ans": 0, "steps": "Use the <b>Third Angles Theorem<\/b>."}}, {"h": "How to attack the &ldquo;find the variable&rdquo; figures", "body": "<ol><li><b>Look for tick marks.<\/b> Ticks on two sides &rarr; isosceles (set them equal). Ticks on all three &rarr; equilateral (each angle 60&deg;).<\/li>\n<li><b>Look for a straight line.<\/b> An angle sitting on an extended side is an <b>exterior angle<\/b>: set it equal to the two remote interior angles (or use a linear pair, 180&deg;).<\/li>\n<li><b>Look for a right angle.<\/b> The other two angles add to 90&deg;.<\/li>\n<li><b>Congruent triangles?<\/b> Match the vertices first, then set matching parts equal.<\/li>\n<li><b>Check your answer.<\/b> Plug x back in. No angle or side may come out negative (reject extraneous answers like x = &minus;2 in problem 10).<\/li><\/ol>", "check": {"t": "mc", "q": "A quadratic equation gives x = 3 or x = &minus;2, and one of the angles is (4x &minus; 3)&deg;. What do you do with x = &minus;2?", "opts": ["Average the two answers to get x = 0.5", "Reject it: it makes the angle negative", "Use it only for the sides, not the angles", "Use it, because a negative angle is still an angle"], "ans": 1, "steps": "4(&minus;2) &minus; 3 = &minus;11&deg;, and an angle cannot be negative. This is an <b>extraneous<\/b> solution."}}], "sets": [{"title": "Quiz review 4.1 and 4.2 (all 16 problems)", "note": "Every problem from your 4.1 &ndash; 4.2 Quiz Review, with answers from the class key. Problem 16a (plotting the points) is shown already plotted.", "probs": [{"t": "mc", "q": "<b>Quiz review 1.<\/b> Classify the triangle by its sides and angles.", "opts": ["Equilateral and right", "Isosceles and acute", "Isosceles and right", "Scalene and right"], "ans": 2, "steps": "Two tick marks match: <b>isosceles<\/b>. The square marks a right angle: <b>right<\/b>.", "svg": "r1", "num": "QR 1", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 2.<\/b> Classify the triangle by its sides and angles.", "opts": ["Scalene and acute", "Scalene and right", "Isosceles and obtuse", "Scalene and obtuse"], "ans": 3, "steps": "No tick marks and three different side lengths: <b>scalene<\/b>. One angle is wider than a right angle: <b>obtuse<\/b>.", "svg": "r2", "num": "QR 2", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 3.<\/b> Classify the triangle by its sides and angles.", "opts": ["Equilateral and equiangular", "Scalene and equiangular", "Equilateral and obtuse", "Isosceles and acute"], "ans": 0, "steps": "Three tick marks: <b>equilateral<\/b>. Three matching angle arcs: <b>equiangular<\/b>.", "svg": "r3", "num": "QR 3", "sec": 2}, {"t": "text", "q": "<b>Quiz review 4.<\/b> Find x. (The exterior angle is 132&deg;; the remote interior angles are (2x)&deg; and x&deg;.)", "accept": ["44"], "steps": "Exterior Angle Theorem: 132 = 2x + x = 3x. So <b>x = 44<\/b>.", "show": "44", "svg": "r4", "num": "QR 4", "sec": 2}, {"t": "text", "q": "<b>Quiz review 5.<\/b> Find x. (Right triangle; the other acute angle is 50&deg;.)", "accept": ["40"], "steps": "The angles add to 180 and the right angle is 90: x + 50 + 90 = 180, so x = 180 &minus; 140 = <b>40<\/b>.", "show": "40", "svg": "r5", "num": "QR 5 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 5.<\/b> Find y, the exterior angle at the bottom (adjacent to the 50&deg; angle).", "accept": ["130"], "steps": "y and the 50&deg; angle form a linear pair: y = 180 &minus; 50 = <b>130<\/b>. (Also y = 90 + 40, the two remote angles.)", "show": "130", "svg": "r5", "num": "QR 5 (y)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 6.<\/b> Find x. The angles are (2x)&deg;, (x + 20)&deg; and x&deg;.", "accept": ["40"], "steps": "2x + (x + 20) + x = 180, so 4x + 20 = 180, 4x = 160 and <b>x = 40<\/b>.", "show": "40", "svg": "r6", "num": "QR 6", "sec": 2}, {"t": "text", "q": "<b>Quiz review 7.<\/b> Find x. The triangle has three ticks (equilateral) and one angle is (4x &minus; 20)&deg;.", "accept": ["20"], "steps": "Equilateral means each angle is 60&deg;: 4x &minus; 20 = 60, 4x = 80, <b>x = 20<\/b>.", "show": "20", "svg": "r7", "num": "QR 7", "sec": 2}, {"t": "text", "q": "<b>Quiz review 8.<\/b> Find x. (The small triangle has angles 28&deg;, 22&deg; and x&deg;.)", "accept": ["130"], "steps": "28 + 22 + x = 180, so 50 + x = 180 and <b>x = 130<\/b>.", "show": "130", "svg": "r8", "num": "QR 8 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 8.<\/b> Find y, the angle that forms a linear pair with x.", "accept": ["50"], "steps": "x and y are a linear pair: y = 180 &minus; 130 = <b>50<\/b>.", "show": "50", "svg": "r8", "num": "QR 8 (y)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 9.<\/b> Find x. The two marked sides are 3x + 8 and 5x &minus; 2.", "accept": ["5"], "steps": "The tick marks show congruent sides: 3x + 8 = 5x &minus; 2. So 10 = 2x and <b>x = 5<\/b>. (Both sides are 23.)", "show": "5", "svg": "r9", "num": "QR 9", "sec": 2}, {"t": "text", "q": "<b>Quiz review 10.<\/b> Solve for x. Exterior angle &ang;ABD = (5x + 2)&deg;; remote interior angles are (x&sup2; &minus; 1)&deg; and (4x &minus; 3)&deg;.", "accept": ["3"], "steps": "Exterior Angle Theorem: x&sup2; &minus; 1 + 4x &minus; 3 = 5x + 2, so x&sup2; &minus; x &minus; 6 = 0 and (x &minus; 3)(x + 2) = 0. x = 3 or x = &minus;2. <b>Reject x = &minus;2<\/b>: then 4x &minus; 3 = &minus;11&deg;, which is impossible. So <b>x = 3<\/b>.", "show": "3", "svg": "r10", "num": "QR 10 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 10.<\/b> Now find m&ang;ABD = (5x + 2)&deg; with x = 3.", "accept": ["17"], "steps": "5(3) + 2 = <b>17&deg;<\/b>. Check: (3&sup2; &minus; 1) + (4(3) &minus; 3) = 8 + 9 = 17.", "show": "17", "svg": "r10", "num": "QR 10 (&ang;ABD)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 11.<\/b> The two triangles are congruent. The angles marked 5x&deg; and 85&deg; correspond. Find x.", "accept": ["17"], "steps": "Corresponding angles are equal: 5x = 85, so <b>x = 17<\/b>.", "show": "17", "svg": "r11", "num": "QR 11 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 11.<\/b> The angles marked (2y)&deg; and (3y &minus; 15)&deg; correspond. Find y.", "accept": ["15"], "steps": "2y = 3y &minus; 15, so <b>y = 15<\/b>.", "show": "15", "svg": "r11", "num": "QR 11 (y)", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12a.<\/b> Is this statement always, sometimes or never true? &ldquo;An isosceles triangle has at least two obtuse angles.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 2, "steps": "A triangle cannot have more than one obtuse angle (two obtuse angles already add to more than 180&deg;).<br>Answer: <b>Never<\/b>.", "num": "QR 12a", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12b.<\/b> Is this statement always, sometimes or never true? &ldquo;An equilateral triangle has two congruent sides.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 0, "steps": "All 3 sides of an equilateral triangle are congruent, so any two of them are congruent.<br>Answer: <b>Always<\/b>.", "num": "QR 12b", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12c.<\/b> Is this statement always, sometimes or never true? &ldquo;A scalene triangle is acute.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 1, "steps": "A scalene triangle can be right, obtuse or acute.<br>Answer: <b>Sometimes<\/b>.", "num": "QR 12c", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12d.<\/b> Is this statement always, sometimes or never true? &ldquo;A right triangle has two acute angles.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 0, "steps": "One angle is 90&deg;, and the other two must be positive and add to 90&deg;, so neither can be 90&deg; or more.<br>Answer: <b>Always<\/b>.", "num": "QR 12d", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12e.<\/b> Is this statement always, sometimes or never true? &ldquo;An isosceles triangle has three congruent sides.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 1, "steps": "Isosceles means <i>at least<\/i> two congruent sides. Three congruent sides happens only when it is also equilateral.<br>Answer: <b>Sometimes<\/b>.", "num": "QR 12e", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12f.<\/b> Is this statement always, sometimes or never true? &ldquo;An equiangular triangle has two congruent sides.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 0, "steps": "An equiangular triangle is also equilateral (all three sides congruent), so any two sides are congruent.<br>Answer: <b>Always<\/b>.", "num": "QR 12f", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12g.<\/b> Is this statement always, sometimes or never true? &ldquo;An obtuse triangle can have a right angle.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 2, "steps": "An obtuse triangle has one angle more than 90&deg;, and the other two must be acute. A right angle would push the sum past 180&deg;.<br>Answer: <b>Never<\/b>.", "num": "QR 12g", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 13.<\/b> The triangles QRS and QPS (kite-shaped figure) are congruent. Which congruence statement is correct?", "opts": ["&Delta;QRS &cong; &Delta;PQS", "&Delta;QRS &cong; &Delta;QPS", "&Delta;RQS &cong; &Delta;PSQ", "&Delta;QRS &cong; &Delta;SPQ"], "ans": 1, "steps": "The key matches &ang;RQS &cong; &ang;PQS, &ang;RSQ &cong; &ang;PSQ, &ang;QRS &cong; &ang;QPS. So R&harr;P and Q, S stay in place: <b>&Delta;QRS &cong; &Delta;QPS<\/b>.", "svg": "r13", "num": "QR 13 (statement)", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 13.<\/b> In the same figure, which side is congruent to SR?", "opts": ["QR", "QS", "SP", "QP"], "ans": 2, "steps": "R&harr;P and S&harr;S, so SR &cong; <b>SP<\/b>.", "svg": "r13", "num": "QR 13 (side)", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 13.<\/b> The side QS belongs to both triangles. Which reason says QS &cong; QS?", "opts": ["Third Angles Theorem", "Definition of midpoint", "Symmetric Property of Congruence", "Reflexive Property of Congruence"], "ans": 3, "steps": "A shared side is congruent to itself: <b>Reflexive Property of Congruence<\/b>.", "svg": "r13", "num": "QR 13 (shared)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 14.<\/b> &Delta;XYZ is isosceles with vertex angle X. XY = 5x &minus; 3, YZ = 3x + 7 and XZ = 4x + 1. Find x.", "accept": ["4"], "steps": "The vertex is X, so the legs are XY and XZ: 5x &minus; 3 = 4x + 1, so <b>x = 4<\/b>.", "show": "4", "svg": "r14", "num": "QR 14 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 14.<\/b> Find the perimeter of &Delta;XYZ.", "accept": ["53"], "steps": "XY = 5(4) &minus; 3 = 17, XZ = 4(4) + 1 = 17, YZ = 3(4) + 7 = 19. Perimeter = 17 + 17 + 19 = <b>53<\/b>.", "show": "53", "svg": "r14", "num": "QR 14 (perimeter)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 15.<\/b> &Delta;AIR &cong; &Delta;JDN, AI = 10, AR = 4x + 3, m&ang;A = (3y + 22)&deg;, JD = 2z &minus; 6, JN = 21 and m&ang;J = 97&deg;. Find x.", "accept": ["4.5", "9/2"], "steps": "A&harr;J, I&harr;D, R&harr;N. So AR &cong; JN: 4x + 3 = 21, 4x = 18, <b>x = 4.5<\/b>.", "show": "4.5", "num": "QR 15 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 15.<\/b> Same triangles. Find y.", "accept": ["25"], "steps": "&ang;A &cong; &ang;J: 3y + 22 = 97, 3y = 75, <b>y = 25<\/b>.", "show": "25", "num": "QR 15 (y)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 15.<\/b> Same triangles. Find z.", "accept": ["8"], "steps": "AI &cong; JD: 10 = 2z &minus; 6, 16 = 2z, <b>z = 8<\/b>.", "show": "8", "num": "QR 15 (z)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 16b.<\/b> A(&minus;3, &minus;1), B(7, &minus;1), C(1, 7). Find AB.", "accept": ["10"], "steps": "AB = &radic;[(7 &minus; (&minus;3))&sup2; + (&minus;1 &minus; (&minus;1))&sup2;] = &radic;100 = <b>10<\/b>.", "show": "10", "svg": "r16", "num": "QR 16 (AB)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 16b.<\/b> Find BC.", "accept": ["10"], "steps": "BC = &radic;[(1 &minus; 7)&sup2; + (7 &minus; (&minus;1))&sup2;] = &radic;(36 + 64) = &radic;100 = <b>10<\/b>.", "show": "10", "svg": "r16", "num": "QR 16 (BC)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 16b.<\/b> Find AC in simplest radical form.", "accept": ["4√5", "4sqrt5", "√80", "sqrt80", "4√(5)", "8.94427191"], "steps": "AC = &radic;[(1 &minus; (&minus;3))&sup2; + (7 &minus; (&minus;1))&sup2;] = &radic;(16 + 64) = &radic;80 = <b>4&radic;5<\/b>.", "show": "4√5", "svg": "r16", "num": "QR 16 (AC)", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 16b.<\/b> Classify the triangle ABC by its sides.", "opts": ["Isosceles", "Scalene", "Right", "Equilateral"], "ans": 0, "steps": "AB = BC = 10 and AC = 4&radic;5 is different, so exactly two sides match: <b>isosceles<\/b>.", "svg": "r16", "num": "QR 16 (classify)", "sec": 2}, {"t": "proof", "q": "<b>Quiz review proof 1.<\/b> Use the DEFINITION OF CONGRUENT TRIANGLES. Given: &ang;MNO &cong; &ang;OPM, &ang;NMO &cong; &ang;POM, NO &cong; MP, NM &cong; OP. Prove: &Delta;NMO &cong; &Delta;POM.", "rows": [{"s": "∠MNO ≅ ∠OPM, ∠NMO ≅ ∠POM, NO ≅ MP, NM ≅ OP", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "MO ≅ MO", "r": ["Reflexive Property of Congruence"], "why": "MO is a side of both triangles.", "fixed": false}, {"s": "∠NOM ≅ ∠PMO", "r": ["Third Angles Theorem"], "why": "Two angle pairs match, so the third pair matches.", "fixed": false}, {"s": "ΔNMO ≅ ΔPOM", "r": ["Definition of congruent triangles"], "why": "All six pairs of corresponding parts are congruent.", "fixed": false}], "steps": "Shared side, third angles, then the definition.", "img": "qp1", "num": "QR proof 1", "sec": 2}, {"t": "proof", "q": "<b>Quiz review proof 2.<\/b> Use the DEFINITION OF CONGRUENT TRIANGLES. Given: AB &#8741; DC, AB &cong; DC, E is the midpoint of AC and BD. Prove: &Delta;AEB &cong; &Delta;CED.", "rows": [{"s": "AB ∥ DC, AB ≅ DC, E is the midpoint of AC and BD", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "AE ≅ EC and BE ≅ ED", "r": ["Definition
