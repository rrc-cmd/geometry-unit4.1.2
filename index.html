 of midpoint"], "why": "A midpoint splits a segment into two congruent parts.", "fixed": false}, {"s": "∠BAE ≅ ∠DCE, ∠ABE ≅ ∠CDE", "r": ["Alternate Interior Angles Theorem"], "why": "AB &#8741; DC, with AC and BD as transversals.", "fixed": false}, {"s": "∠AEB ≅ ∠DEC", "r": ["Vertical Angles Congruence Theorem"], "why": "AC and BD cross at E.", "fixed": false}, {"s": "ΔAEB ≅ ΔCED", "r": ["Definition of congruent triangles"], "why": "AB &cong; CD, AE &cong; CE, BE &cong; DE and all three angle pairs match.", "fixed": false}], "steps": "Midpoint &rarr; sides, parallel lines &rarr; angles, vertical angles &rarr; the last angle pair.", "img": "qp2", "num": "QR proof 2", "sec": 2}]}], "new": true}], "tests": [{"title": "Practice Test 1", "qs": [{"t": "mc", "q": "A triangle has angles 35&deg;, 55&deg; and 90&deg;. Classify it by its angles.", "opts": ["Obtuse", "Right", "Equiangular", "Acute"], "ans": 1, "steps": "35 + 55 + 90 = 180. One angle is exactly 90&deg;: <b>right<\/b>.", "num": "By angles 1", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 5, 5 and 8. Classify it by its sides.", "opts": ["Scalene", "Right", "Isosceles", "Equilateral"], "ans": 2, "steps": "Sides 5, 5, 8: exactly two match: <b>isosceles<\/b>.", "num": "By sides 1", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 44&deg;, (3x + 12)&deg; and (3x + 64)&deg;. Find x.", "accept": ["10"], "steps": "44 + (3x + 12) + (3x + 64) = 180. Combine like terms: 6x + 120 = 180. Solve: <b>x = 10<\/b>.", "show": "10", "num": "Sum 1", "sec": 0}, {"t": "text", "q": "An exterior angle of a triangle is (3x + 48)&deg;. The two remote interior angles are (2x − 8)&deg; and 63&deg;. Find x.", "accept": ["7"], "steps": "Exterior angle = sum of the remote angles: 3x + 48 = (2x − 8) + 63. Simplify and solve: <b>x = 7<\/b>.", "show": "7", "num": "Exterior 1", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 3x + 5 and QR = 5x &minus; 7. Find x.", "accept": ["6"], "steps": "The legs PQ and QR are equal: 3x + 5 = 5x &minus; 7. Solve: <b>x = 6<\/b>.", "show": "6", "num": "Isosceles 2", "sec": 0}, {"t": "text", "q": "An isosceles triangle has a vertex angle of 40&deg;. How large is each base angle? (just the number)", "accept": ["70"], "steps": "The base angles are equal and the three angles add to 180: 180 &minus; 40 = 140, and 140 &divide; 2 = <b>70&deg;<\/b>.", "show": "70", "num": "Base angles 1", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(0, 0), Q(4, 0), R(2, 5). Use the distance formula to classify it by its sides.", "opts": ["Scalene", "Equilateral", "Right", "Isosceles"], "ans": 3, "steps": "Distances: PQ = 4, QR = &radic;29, RP = &radic;29. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 16, 29, 29: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Coordinates 1", "sec": 0}, {"t": "mc", "q": "<b>Notes Example 4b.<\/b> Is &Delta;RST a right triangle? The slope of RT is &minus;2/3 and the slope of ST is 3/2.", "opts": ["Yes: the slopes are opposite reciprocals, so RT &#8869; ST", "No: the slopes are different, so the sides are not perpendicular", "No: the slopes multiply to 1, not &minus;1, so there is no right angle", "Yes: the slopes are equal, so the sides are perpendicular"], "ans": 0, "steps": "(&minus;2/3)(3/2) = &minus;1, so the slopes are opposite reciprocals and RT &#8869; ST. The right angle is at T.<br><b>Key note:<\/b> the notes key labels the 3/2 slope &ldquo;m<sub>RT<\/sub>&rdquo;. It should be <b>m<sub>ST<\/sub><\/b> (RT &#8869; ST).", "svg": "c4", "num": "Ex 4b", "sec": 0}, {"t": "mc", "q": "&Delta;ABC &cong; &Delta;YXZ. Which angle is congruent to &ang;A?", "opts": ["&ang;X", "&ang;Y", "&ang;Z", "&ang;B"], "ans": 1, "steps": "A is letter 1 in ABC, so its partner is letter 1 of YXZ: <b>&ang;Y<\/b>.", "num": "Corresp 1", "sec": 1}, {"t": "mc", "q": "&Delta;STU &cong; &Delta;WVX. Which side is congruent to TU?", "opts": ["TU", "WX", "VX", "WV"], "ans": 2, "steps": "Match the letter positions: TU are letters 2 and 3 of STU, so they match letters 2 and 3 of WVX: <b>VX<\/b>.", "num": "Corresp 4", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 4x + 9, DE = 25, BC = 3y + 4 and EF = 22. Find x.", "accept": ["4"], "steps": "AB &cong; DE: 4x + 9 = 25, so 4x = 16 and <b>x = 4<\/b>.", "show": "4", "num": "Variables 1 (x)", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 50&deg; and m&ang;K = 60&deg;. m&ang;T = (5x)&deg; (T corresponds to L). Find x.", "accept": ["14"], "steps": "&ang;L = 180 &minus; (50 + 60) = 70&deg;. L&harr;T: 5x  = 70, so <b>x = 14<\/b>.", "show": "14", "num": "Angle + x 1", "sec": 1}, {"t": "text", "q": "<b>HW 5e.<\/b> Given &Delta;BCM &cong; &Delta;ZYR (BC = 8 m, &ang;C = 103&deg;, ZR = 15 m, &ang;Z = 45&deg;, YR = 11 m). Find m&ang;M = ______&deg;", "accept": ["32"], "steps": "&ang;M &cong; &ang;R, and &ang;R = 180 &minus; (103 + 45) = 180 &minus; 148 = <b>32&deg;<\/b>.<br><b>Key error:<\/b> the HW key writes 180 &minus; (103 + 45) = 180 &minus; 151 = 29&deg;. But 103 + 45 = 148, so the answer is 32&deg;, not 29&deg;.", "show": "32", "img": "h5", "num": "HW 5e", "sec": 1}, {"t": "tf", "q": "If &Delta;ABC &cong; &Delta;DEF, then &ang;B &cong; &ang;E.", "opts": ["True", "False"], "ans": 0, "steps": "B and E are both the 2nd letters, so they correspond.", "sec": 1}, {"t": "mc", "q": "Which reason justifies &ldquo;MO &cong; MO&rdquo; when MO is a side of both triangles?", "opts": ["Transitive Property of Congruence", "Symmetric Property of Congruence", "Definition of midpoint", "Reflexive Property of Congruence"], "ans": 3, "steps": "A segment is congruent to itself: the <b>Reflexive Property of Congruence<\/b>.", "sec": 1}, {"t": "proof", "q": "<b>Notes proof 1.<\/b> Given: &ang;MNO &cong; &ang;OPM, &ang;NMO &cong; &ang;POM, NO &cong; MP, NM &cong; OP. Prove: &Delta;NMO &cong; &Delta;POM.", "rows": [{"s": "∠MNO ≅ ∠OPM, ∠NMO ≅ ∠POM, NO ≅ MP, NM ≅ OP", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "MO ≅ MO", "r": ["Reflexive Property of Congruence"], "why": "MO is a side of both triangles (the shared side).", "fixed": false}, {"s": "∠NOM ≅ ∠PMO", "r": ["Third Angles Theorem"], "why": "Two pairs of angles match, so the third pair matches.", "fixed": false}, {"s": "ΔNMO ≅ ΔPOM", "r": ["Definition of congruent triangles"], "why": "All three pairs of sides and all three pairs of angles are congruent.", "fixed": false}], "steps": "You have four of the six pairs in the Given. Get the shared side and the third angle pair, then finish with the definition.", "img": "qp1", "num": "Notes proof 1", "sec": 1}, {"t": "mc", "q": "<b>Quiz review 1.<\/b> Classify the triangle by its sides and angles.", "opts": ["Isosceles and right", "Equilateral and right", "Isosceles and acute", "Scalene and right"], "ans": 0, "steps": "Two tick marks match: <b>isosceles<\/b>. The square marks a right angle: <b>right<\/b>.", "svg": "r1", "num": "QR 1", "sec": 2}, {"t": "text", "q": "<b>Quiz review 4.<\/b> Find x. (The exterior angle is 132&deg;; the remote interior angles are (2x)&deg; and x&deg;.)", "accept": ["44"], "steps": "Exterior Angle Theorem: 132 = 2x + x = 3x. So <b>x = 44<\/b>.", "show": "44", "svg": "r4", "num": "QR 4", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12a.<\/b> Is this statement always, sometimes or never true? &ldquo;An isosceles triangle has at least two obtuse angles.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 2, "steps": "A triangle cannot have more than one obtuse angle (two obtuse angles already add to more than 180&deg;).<br>Answer: <b>Never<\/b>.", "num": "QR 12a", "sec": 2}, {"t": "text", "q": "<b>Quiz review 10.<\/b> Solve for x. Exterior angle &ang;ABD = (5x + 2)&deg;; remote interior angles are (x&sup2; &minus; 1)&deg; and (4x &minus; 3)&deg;.", "accept": ["3"], "steps": "Exterior Angle Theorem: x&sup2; &minus; 1 + 4x &minus; 3 = 5x + 2, so x&sup2; &minus; x &minus; 6 = 0 and (x &minus; 3)(x + 2) = 0. x = 3 or x = &minus;2. <b>Reject x = &minus;2<\/b>: then 4x &minus; 3 = &minus;11&deg;, which is impossible. So <b>x = 3<\/b>.", "show": "3", "svg": "r10", "num": "QR 10 (x)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 16b.<\/b> Find AC in simplest radical form.", "accept": ["4√5", "4sqrt5", "√80", "sqrt80", "4√(5)", "8.94427191"], "steps": "AC = &radic;[(1 &minus; (&minus;3))&sup2; + (7 &minus; (&minus;1))&sup2;] = &radic;(16 + 64) = &radic;80 = <b>4&radic;5<\/b>.", "show": "4√5", "svg": "r16", "num": "QR 16 (AC)", "sec": 2}]}, {"title": "Practice Test 2", "qs": [{"t": "mc", "q": "A triangle has angles 60&deg;, 60&deg; and 60&deg;. Classify it by its angles.", "opts": ["Acute", "Equiangular", "Right", "Obtuse"], "ans": 1, "steps": "60 + 60 + 60 = 180. All three angles are 60&deg;: <b>equiangular<\/b>.", "num": "By angles 2", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 6, 9 and 11. Classify it by its sides.", "opts": ["Isosceles", "Equilateral", "Scalene", "Right"], "ans": 2, "steps": "Sides 6, 9, 11: all different: <b>scalene<\/b>.", "num": "By sides 2", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 47&deg;, (4x − 10)&deg; and (3x + 87)&deg;. Find x.", "accept": ["8"], "steps": "47 + (4x − 10) + (3x + 87) = 180. Combine like terms: 7x + 124 = 180. Solve: <b>x = 8<\/b>.", "show": "8", "num": "Sum 2", "sec": 0}, {"t": "text", "q": "An exterior angle of a triangle is (3x + 10)&deg;. The two remote interior angles are (x + 4)&deg; and 34&deg;. Find x.", "accept": ["14"], "steps": "Exterior angle = sum of the remote angles: 3x + 10 = (x + 4) + 34. Simplify and solve: <b>x = 14<\/b>.", "show": "14", "num": "Exterior 2", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 4x &minus; 1 and QR = 2x + 9. Find x.", "accept": ["5"], "steps": "The legs PQ and QR are equal: 4x &minus; 1 = 2x + 9. Solve: <b>x = 5<\/b>.", "show": "5", "num": "Isosceles 3", "sec": 0}, {"t": "text", "q": "An isosceles triangle has a base angle of 50&deg;. How large is the vertex angle? (just the number)", "accept": ["80"], "steps": "The two base angles are 50 + 50 = 100, so the vertex angle is 180 &minus; 100 = <b>80&deg;<\/b>.", "show": "80", "num": "Vertex angle 1", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(1, 1), Q(1, 6), R(5, 1). Use the distance formula to classify it by its sides.", "opts": ["Right", "Equilateral", "Isosceles", "Scalene"], "ans": 3, "steps": "Distances: PQ = 5, QR = &radic;41, RP = 4. All different: scalene. The squares 16 + 25 = 41 add up as a&sup2; + b&sup2; = c&sup2;, so it is a <b>right<\/b> triangle.", "num": "Coordinates 2", "sec": 0}, {"t": "text", "q": "<b>Notes Example 5.2.<\/b> Solve for x.", "accept": ["9"], "steps": "(7x &minus; 1) + (7x + 8) + (5x + 2) = 180. Combine: 19x + 9 = 180, so 19x = 171 and <b>x = 9<\/b>.", "show": "9", "svg": "c5_2", "num": "Ex 5.2", "sec": 0}, {"t": "mc", "q": "&Delta;PQR &cong; &Delta;NLM. Which side is congruent to PQ?", "opts": ["NL", "LM", "PQ", "NM"], "ans": 0, "steps": "Match the letter positions: PQ are letters 1 and 2 of PQR, so they match letters 1 and 2 of NLM: <b>NL<\/b>.", "num": "Corresp 2", "sec": 1}, {"t": "mc", "q": "&Delta;GHI &cong; &Delta;DEC. Which angle is congruent to &ang;G?", "opts": ["&ang;C", "&ang;D", "&ang;E", "&ang;H"], "ans": 1, "steps": "G is letter 1 in GHI, so its partner is letter 1 of DEC: <b>&ang;D<\/b>.", "num": "Corresp 5", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 3x + 5, DE = 26, BC = 2y + 3 and EF = 9. Find x.", "accept": ["7"], "steps": "AB &cong; DE: 3x + 5 = 26, so 3x = 21 and <b>x = 7<\/b>.", "show": "7", "num": "Variables 2 (x)", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 35&deg; and m&ang;K = 85&deg;. m&ang;T = (5x &minus; 5)&deg; (T corresponds to L). Find x.", "accept": ["13"], "steps": "&ang;L = 180 &minus; (35 + 85) = 60&deg;. L&harr;T: 5x &minus; 5 = 60, so <b>x = 13<\/b>.", "show": "13", "num": "Angle + x 2", "sec": 1}, {"t": "text", "q": "<b>HW 9.<\/b> &Delta;PRS &cong; &Delta;CFH. m&ang;S = 62&deg; (since m&ang;P = 28&deg; and m&ang;R = 90&deg;) and m&ang;H = (6z &minus; 4)&deg;. Find z.", "accept": ["11"], "steps": "S&harr;H: 62 = 6z &minus; 4, 66 = 6z, <b>z = 11<\/b>.", "show": "11", "img": "h9", "num": "HW 9 (z)", "sec": 1}, {"t": "tf", "q": "If &Delta;ABC &cong; &Delta;DEF, then AC &cong; DE.", "opts": ["True", "False"], "ans": 1, "steps": "AC corresponds to DF (1st and 3rd letters), not DE.", "sec": 1}, {"t": "mc", "q": "E is the midpoint of AC. Which statement follows by the Definition of midpoint?", "opts": ["AC &cong; BD", "&ang;AEB &cong; &ang;CED", "AE &cong; EC", "AB &#8741; CD"], "ans": 2, "steps": "A midpoint splits the segment into two congruent segments: <b>AE &cong; EC<\/b>.", "sec": 1}, {"t": "proof", "q": "<b>Notes proof 2.<\/b> Given: AB &#8741; DC, AB &cong; DC, E is the midpoint of AC and BD. Prove: &Delta;AEB &cong; &Delta;CED.<br><b>Key note:<\/b> the printed Given says &ldquo;midpoint of AD and BC&rdquo;; the diagonals are <b>AC and BD<\/b>, and the key fixes it by hand (as written here).", "rows": [{"s": "AB ∥ DC, AB ≅ DC, E is the midpoint of AC and BD", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "AE ≅ EC and BE ≅ ED", "r": ["Definition of midpoint"], "why": "A midpoint splits a segment into two congruent parts.", "fixed": false}, {"s": "∠BAE ≅ ∠DCE, ∠ABE ≅ ∠CDE", "r": ["Alternate Interior Angles Theorem"], "why": "AB &#8741; DC, and AC and BD are transversals.", "fixed": false}, {"s": "∠AEB ≅ ∠DEC", "r": ["Vertical Angles Congruence Theorem"], "why": "AC and BD cross at E.", "fixed": false}, {"s": "ΔAEB ≅ ΔCED", "r": ["Definition of congruent triangles"], "why": "Sides: AB &cong; CD, AE &cong; CE, BE &cong; DE. Angles: A &cong; C, B &cong; D, E &cong; E (vertical).", "fixed": false}], "steps": "Parallel lines give the two pairs of alternate interior angles, the midpoint gives two pairs of sides, vertical angles give the third angle pair.", "img": "qp2", "num": "Notes proof 2", "sec": 1}, {"t": "mc", "q": "<b>Quiz review 2.<\/b> Classify the triangle by its sides and angles.", "opts": ["Scalene and acute", "Scalene and right", "Isosceles and obtuse", "Scalene and obtuse"], "ans": 3, "steps": "No tick marks and three different side lengths: <b>scalene<\/b>. One angle is wider than a right angle: <b>obtuse<\/b>.", "svg": "r2", "num": "QR 2", "sec": 2}, {"t": "text", "q": "<b>Quiz review 7.<\/b> Find x. The triangle has three ticks (equilateral) and one angle is (4x &minus; 20)&deg;.", "accept": ["20"], "steps": "Equilateral means each angle is 60&deg;: 4x &minus; 20 = 60, 4x = 80, <b>x = 20<\/b>.", "show": "20", "svg": "r7", "num": "QR 7", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12e.<\/b> Is this statement always, sometimes or never true? &ldquo;An isosceles triangle has three congruent sides.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 1, "steps": "Isosceles means <i>at least<\/i> two congruent sides. Three congruent sides happens only when it is also equilateral.<br>Answer: <b>Sometimes<\/b>.", "num": "QR 12e", "sec": 2}, {"t": "text", "q": "<b>Quiz review 15.<\/b> &Delta;AIR &cong; &Delta;JDN, AI = 10, AR = 4x + 3, m&ang;A = (3y + 22)&deg;, JD = 2z &minus; 6, JN = 21 and m&ang;J = 97&deg;. Find x.", "accept": ["4.5", "9/2"], "steps": "A&harr;J, I&harr;D, R&harr;N. So AR &cong; JN: 4x + 3 = 21, 4x = 18, <b>x = 4.5<\/b>.", "show": "4.5", "num": "QR 15 (x)", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 13.<\/b> The triangles QRS and QPS (kite-shaped figure) are congruent. Which congruence statement is correct?", "opts": ["&Delta;QRS &cong; &Delta;QPS", "&Delta;QRS &cong; &Delta;PQS", "&Delta;RQS &cong; &Delta;PSQ", "&Delta;QRS &cong; &Delta;SPQ"], "ans": 0, "steps": "The key matches &ang;RQS &cong; &ang;PQS, &ang;RSQ &cong; &ang;PSQ, &ang;QRS &cong; &ang;QPS. So R&harr;P and Q, S stay in place: <b>&Delta;QRS &cong; &Delta;QPS<\/b>.", "svg": "r13", "num": "QR 13 (statement)", "sec": 2}]}, {"title": "Practice Test 3", "qs": [{"t": "mc", "q": "A triangle has angles 25&deg;, 40&deg; and 115&deg;. Classify it by its angles.", "opts": ["Equiangular", "Obtuse", "Acute", "Right"], "ans": 1, "steps": "25 + 40 + 115 = 180. 115&deg; is more than 90&deg;: <b>obtuse<\/b>.", "num": "By angles 3", "sec": 0}, {"t": "mc", "q": "A triangle has side lengths 9, 9 and 9. Classify it by its sides.", "opts": ["Scalene", "Right", "Equilateral", "Isosceles"], "ans": 2, "steps": "Sides 9, 9, 9: all three match: <b>equilateral<\/b>.", "num": "By sides 3", "sec": 0}, {"t": "text", "q": "The angles of a triangle measure 58&deg;, (2x)&deg; and (3x + 87)&deg;. Find x.", "accept": ["7"], "steps": "58 + (2x) + (3x + 87) = 180. Combine like terms: 5x + 145 = 180. Solve: <b>x = 7<\/b>.", "show": "7", "num": "Sum 3", "sec": 0}, {"t": "text", "q": "An exterior angle of a triangle is (3x + 51)&deg;. The two remote interior angles are (2x + 7)&deg; and 50&deg;. Find x.", "accept": ["6"], "steps": "Exterior angle = sum of the remote angles: 3x + 51 = (2x + 7) + 50. Simplify and solve: <b>x = 6<\/b>.", "show": "6", "num": "Exterior 3", "sec": 0}, {"t": "text", "q": "&Delta;PQR is isosceles with vertex angle Q. PQ = 7x &minus; 4 and QR = 3x + 12. Find x.", "accept": ["4"], "steps": "The legs PQ and QR are equal: 7x &minus; 4 = 3x + 12. Solve: <b>x = 4<\/b>.", "show": "4", "num": "Isosceles 4", "sec": 0}, {"t": "text", "q": "The angles of an equiangular triangle are each (4x &minus; 20)&deg;. Find x.", "accept": ["20"], "steps": "Each angle of an equiangular triangle is 60&deg;: 4x &minus; 20 = 60, so 4x = 80 and <b>x = 20<\/b>. (Quiz review 7.)", "show": "20", "num": "Equiangular 1", "sec": 0}, {"t": "mc", "q": "Triangle PQR has P(0, 0), Q(6, 2), R(2, 6). Use the distance formula to classify it by its sides.", "opts": ["Equilateral", "Scalene", "Right", "Isosceles"], "ans": 3, "steps": "Distances: PQ = 2&radic;10, QR = 4&radic;2, RP = 2&radic;10. Exactly two equal: isosceles. Check a&sup2; + b&sup2; = c&sup2; with the squares 32, 40, 40: it does not work, so it is <b>not<\/b> a right triangle.", "num": "Coordinates 3", "sec": 0}, {"t": "text", "q": "<b>Notes Example 6.2.<\/b> Find the exterior angle &ang;DCB and then the interior angle &ang;1 at C. (Give the interior angle &ang;1.)", "accept": ["56"], "steps": "Exterior = 3(36) + 16 = 124&deg;. The interior angle at C is its linear pair: 180 &minus; 124 = <b>56&deg;<\/b>. Check: 52 + 72 + 56 = 180.", "show": "56", "svg": "c6_2", "num": "Ex 6.2 (&ang;1)", "sec": 0}, {"t": "mc", "q": "&Delta;DEF &cong; &Delta;KJH. Which angle is congruent to &ang;F?", "opts": ["&ang;H", "&ang;K", "&ang;D", "&ang;J"], "ans": 0, "steps": "F is letter 3 in DEF, so its partner is letter 3 of KJH: <b>&ang;H<\/b>.", "num": "Corresp 3", "sec": 1}, {"t": "mc", "q": "&Delta;KLM &cong; &Delta;STR. Which side is congruent to KL?", "opts": ["TR", "ST", "KL", "SR"], "ans": 1, "steps": "Match the letter positions: KL are letters 1 and 2 of KLM, so they match letters 1 and 2 of STR: <b>ST<\/b>.", "num": "Corresp 6", "sec": 1}, {"t": "text", "q": "&Delta;ABC &cong; &Delta;DEF. AB = 4x + 7, DE = 27, BC = 3y + 5 and EF = 32. Find x.", "accept": ["5"], "steps": "AB &cong; DE: 4x + 7 = 27, so 4x = 20 and <b>x = 5<\/b>.", "show": "5", "num": "Variables 3 (x)", "sec": 1}, {"t": "text", "q": "&Delta;JKL &cong; &Delta;RST. m&ang;J = 48&deg; and m&ang;K = 72&deg;. m&ang;T = (5x)&deg; (T corresponds to L). Find x.", "accept": ["12"], "steps": "&ang;L = 180 &minus; (48 + 72) = 60&deg;. L&harr;T: 5x  = 60, so <b>x = 12<\/b>.", "show": "12", "num": "Angle + x 3", "sec": 1}, {"t": "text", "q": "<b>HW 12.<\/b> Same triangles. m&ang;S = 56&deg;, m&ang;B = 21&deg;, m&ang;H = (7y + 5)&deg;. Find y.", "accept": ["14"], "steps": "&ang;T = 180 &minus; (21 + 56) = 103&deg;. T&harr;H, so 7y + 5 = 103, 7y = 98, <b>y = 14<\/b>.", "show": "14", "num": "HW 12 (y)", "sec": 1}, {"t": "tf", "q": "Two triangles are congruent if their corresponding angles are congruent but their sides are not.", "opts": ["True", "False"], "ans": 1, "steps": "The definition needs <b>all<\/b> corresponding sides and all corresponding angles congruent.", "sec": 1}, {"t": "mc", "q": "Which theorem gives &ang;BAE &cong; &ang;DCE when AB &#8741; DC and AC is a transversal?", "opts": ["Third Angles Theorem", "Vertical Angles Congruence Theorem", "Alternate Interior Angles Theorem", "Definition of midpoint"], "ans": 2, "steps": "The angles are between the parallel lines on opposite sides of the transversal: <b>alternate interior angles<\/b>.", "sec": 1}, {"t": "proof", "q": "<b>Notes proof.<\/b> Prove the Third Angles Theorem. Given: &ang;A &cong; &ang;X, &ang;B &cong; &ang;Y. Prove: &ang;C &cong; &ang;Z.", "rows": [{"s": "∠A ≅ ∠X, ∠B ≅ ∠Y", "r": ["Given"], "why": "Given", "fixed": true}, {"s": "m∠A = m∠X, m∠B = m∠Y", "r": ["Definition of congruent angles", "Definition of congruence"], "why": "Congruent angles have equal measures.", "fixed": false}, {"s": "m∠A + m∠B + m∠C = 180 and m∠X + m∠Y + m∠Z = 180", "r": ["Triangle Sum Theorem"], "why": "The angles of each triangle add to 180&deg;.", "fixed": false}, {"s": "m∠A + m∠B + m∠C = m∠X + m∠Y + m∠Z", "r": ["Transitive Property of Equality", "Substitution Property of Equality"], "why": "Both sums equal 180.", "fixed": false}, {"s": "m∠X + m∠Y + m∠C = m∠X + m∠Y + m∠Z", "r": ["Substitution Property of Equality", "Transitive Property of Equality"], "why": "Replace m&ang;A with m&ang;X and m&ang;B with m&ang;Y using step 2.", "fixed": false}, {"s": "m∠C = m∠Z", "r": ["Subtraction Property of Equality"], "why": "Subtract m&ang;X + m&ang;Y from both sides.", "fixed": false}, {"s": "∠C ≅ ∠Z", "r": ["Definition of congruent angles", "Definition of congruence"], "why": "Equal measures mean congruent angles.", "fixed": false}], "steps": "Pattern: write each triangle&rsquo;s 180&deg; sum, set them equal, then cancel the two angle pairs you already know.", "num": "Third Angles proof", "sec": 1}, {"t": "mc", "q": "<b>Quiz review 3.<\/b> Classify the triangle by its sides and angles.", "opts": ["Scalene and equiangular", "Equilateral and obtuse", "Isosceles and acute", "Equilateral and equiangular"], "ans": 3, "steps": "Three tick marks: <b>equilateral<\/b>. Three matching angle arcs: <b>equiangular<\/b>.", "svg": "r3", "num": "QR 3", "sec": 2}, {"t": "text", "q": "<b>Quiz review 9.<\/b> Find x. The two marked sides are 3x + 8 and 5x &minus; 2.", "accept": ["5"], "steps": "The tick marks show congruent sides: 3x + 8 = 5x &minus; 2. So 10 = 2x and <b>x = 5<\/b>. (Both sides are 23.)", "show": "5", "svg": "r9", "num": "QR 9", "sec": 2}, {"t": "mc", "q": "<b>Quiz review 12g.<\/b> Is this statement always, sometimes or never true? &ldquo;An obtuse triangle can have a right angle.&rdquo;", "opts": ["Always", "Sometimes", "Never"], "ans": 2, "steps": "An obtuse triangle has one angle more than 90&deg;, and the other two must be acute. A right angle would push the sum past 180&deg;.<br>Answer: <b>Never<\/b>.", "num": "QR 12g", "sec": 2}, {"t": "text", "q": "<b>Quiz review 14.<\/b> Find the perimeter of &Delta;XYZ.", "accept": ["53"], "steps": "XY = 5(4) &minus; 3 = 17, XZ = 4(4) + 1 = 17, YZ = 3(4) + 7 = 19. Perimeter = 17 + 17 + 19 = <b>53<\/b>.", "show": "53", "svg": "r14", "num": "QR 14 (perimeter)", "sec": 2}, {"t": "text", "q": "<b>Quiz review 16b.<\/b> Find BC.", "accept": ["10"], "steps": "BC = &radic;[(1 &minus; 7)&sup2; + (7 &minus; (&minus;1))&sup2;] = &radic;(36 + 64) = &radic;100 = <b>10<\/b>.", "show": "10", "svg": "r16", "num": "QR 16 (BC)", "sec": 2}]}], "flash": [{"sec": 0, "front": "Scalene triangle", "back": "<b>0<\/b> congruent sides."}, {"sec": 0, "front": "Isosceles triangle", "back": "<b>At least 2<\/b> congruent sides."}, {"sec": 0, "front": "Equilateral triangle", "back": "<b>3<\/b> congruent sides. Also isosceles."}, {"sec": 0, "front": "Acute triangle", "back": "<b>3<\/b> acute angles (all less than 90&deg;)."}, {"sec": 0, "front": "Right triangle", "back": "<b>1<\/b> right angle (90&deg;)."}, {"sec": 0, "front": "Obtuse triangle", "back": "<b>1<\/b> obtuse angle (more than 90&deg;)."}, {"sec": 0, "front": "Equiangular triangle", "back": "<b>3 congruent angles<\/b>, each 60&deg;. Also acute and equilateral."}, {"sec": 0, "front": "Triangle Sum Theorem", "back": "The <b>interior<\/b> angles of a triangle add to <b>180&deg;<\/b>."}, {"sec": 0, "front": "Interior angles", "back": "The three original angles inside a triangle."}, {"sec": 0, "front": "Exterior angle", "back": "Forms when a side is extended. It is <b>adjacent<\/b> to an interior angle (a linear pair with it)."}, {"sec": 0, "front": "Exterior Angle Theorem", "back": "An exterior angle <b>equals<\/b> the sum of the two <b>non-adjacent (remote) interior angles<\/b>."}, {"sec": 0, "front": "Vertex angle of an isosceles triangle", "back": "The angle between the two congruent <b>legs<\/b>. The other two are the base angles."}, {"sec": 0, "front": "Base angles of an isosceles triangle", "back": "They are <b>congruent<\/b>."}, {"sec": 0, "front": "Each angle of an equilateral triangle", "back": "<b>60&deg;<\/b>."}, {"sec": 0, "front": "Other angles of a right triangle", "back": "They are acute and add to <b>90&deg;<\/b>."}, {"sec": 0, "front": "How to test for a right triangle on a graph", "back": "Opposite reciprocal slopes (product &minus;1), or a&sup2; + b&sup2; = c&sup2; with the squared distances."}, {"sec": 0, "front": "Distance formula", "back": "d = &radic;[(x&#8322; &minus; x&#8321;)&sup2; + (y&#8322; &minus; y&#8321;)&sup2;]"}, {"sec": 1, "front": "Congruent polygons", "back": "All corresponding <b>angles<\/b> and <b>sides<\/b> are congruent."}, {"sec": 1, "front": "Naming congruent polygons", "back": "List the corresponding vertices in the <b>same order<\/b>."}, {"sec": 1, "front": "&Delta;ABC &cong; &Delta;DEF: which side matches AC?", "back": "<b>DF<\/b> (1st and 3rd letters)."}, {"sec": 1, "front": "&Delta;ABC &cong; &Delta;DEF: which angle matches &ang;B?", "back": "<b>&ang;E<\/b> (2nd letter)."}, {"sec": 1, "front": "Third Angles Theorem", "back": "If two angles of one triangle are congruent to two angles of another, the <b>third angles are congruent<\/b>."}, {"sec": 1, "front": "Finding a variable in congruent figures", "back": "Find the matching parts, set them <b>equal<\/b>, solve. If an angle is missing, use the Triangle Sum Theorem first."}, {"sec": 1, "front": "Definition of congruent triangles", "back": "All <b>three pairs of sides<\/b> and <b>three pairs of angles<\/b> are congruent."}, {"sec": 1, "front": "Reason for a shared side", "back": "Reflexive Property of Congruence."}, {"sec": 1, "front": "Reason for halves of a midpoint segment", "back": "Definition of midpoint."}, {"sec": 1, "front": "Reason for angle pairs between parallel lines", "back": "Alternate Interior Angles Theorem (or another angle theorem for parallel lines)."}, {"sec": 1, "front": "Reason for angles where two lines cross", "back": "Vertical Angles Congruence Theorem."}, {"sec": 1, "front": "Last step of a triangle-congruence proof here", "back": "Definition of congruent triangles."}, {"sec": 2, "front": "Equilateral triangle: two congruent sides?", "back": "<b>Always<\/b>: all three sides are congruent, so any two are."}, {"sec": 2, "front": "Isosceles triangle with two obtuse angles?", "back": "<b>Never<\/b>: a triangle has at most one obtuse angle."}, {"sec": 2, "front": "Scalene triangle that is acute?", "back": "<b>Sometimes<\/b>: scalene can be acute, right or obtuse."}, {"sec": 2, "front": "Right triangle with two acute angles?", "back": "<b>Always<\/b>: the other two angles add to 90&deg;."}, {"sec": 2, "front": "Isosceles triangle with three congruent sides?", "back": "<b>Sometimes<\/b>: only when it is also equilateral."}, {"sec": 2, "front": "Equiangular triangle with two congruent sides?", "back": "<b>Always<\/b> (it is also equilateral)."}, {"sec": 2, "front": "Obtuse triangle with a right angle?", "back": "<b>Never<\/b>."}, {"sec": 2   }
  function numval(s) {
    var m = s.match(/^([+-]?\d*\.?\d+)(?:\/(\d+))?$/);
    if (!m) return null;
    var v = parseFloat(m[1]);
    if (m[2]) { if (parseFloat(m[2]) === 0) return null; v = v / parseFloat(m[2]); }
    return v;
  }
  function textOK(q, val) {
    var u = norm(val);
    if (!u) return false;
    for (var i = 0; i < q.accept.length; i++) {
      var a = norm(q.accept[i]);
      if (u === a) return true;
      var nu = numval(u), na = numval(a);
      if (nu !== null && na !== null && Math.abs(nu - na) < 1e-6) return true;
    }
    return false;
  }

  // ---------- rendering pieces
  function figHTML(q) {
    var h = '';
    if (q.img && D.img[q.img]) h += '<div class="fig"><img src="' + D.img[q.img] + '" alt="diagram for this question"></div>';
    if (q.svg && D.svg[q.svg]) h += '<div class="fig">' + D.svg[q.svg] + '</div>';
    return h;
  }
  function stepsHTML(q) { return q.steps ? '<div class="steps"><b>How to solve it</b><div>' + q.steps + '</div></div>' : ''; }

  function card(id) {
    var q = Q[id], st = ST[id] || (ST[id] = {}), isTest = id.charAt(0) === 't';
    var cls = 'q' + (st.done || st.gotit ? (st.ok ? ' ok' : ' bad') : '');
    var h = '<div class="' + cls + '" id="q_' + id + '"><div class="qh">' + (q.num ? '<span class="num">' + q.num + '</span>' : '') + '<div class="qt">' + q.q + '</div></div>' + figHTML(q);
    if (q.t === 'mc' || q.t === 'tf') {
      var ord = (isTest && S.T && S.T.perm && S.T.perm[+id.split('_')[1]]) || q.opts.map(function (_, i) { return i; });
      h += '<div class="opts">';
      ord.forEach(function (i) {
        var c = 'opt';
        if (st.done) { if (i === q.ans) c += ' right'; else if (i === st.sel) c += ' wrong'; }
        h += '<button class="' + c + '" data-act="pick" data-id="' + id + '" data-i="' + i + '"' + (st.done ? ' disabled' : '') + '>' + q.opts[i] + '</button>';
      });
      h += '</div>';
    } else if (q.t === 'text') {
      h += '<div class="row"><input class="ti" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-id="' + id + '" placeholder="Type your answer" value="' + attr(st.val || '') + '"' + (st.done ? ' disabled' : '') + '>' +
        '<button class="btn sm" data-act="check" data-id="' + id + '"' + (st.done ? ' disabled' : '') + '>Check</button></div>';
    } else if (q.t === 'proof') {
      h += '<table class="proof"><tr><th>Statement</th><th>Reason</th></tr>';
      q.rows.forEach(function (r, ri) {
        var rc = st.done ? (st.rowOk[ri] ? ' class="rok"' : ' class="rbad"') : '';
        h += '<tr' + rc + '><td>' + (ri + 1) + '. ' + r.s + '</td><td>';
        if (r.fixed) h += 'Given';
        else {
          h += '<select data-act="psel" data-id="' + id + '" data-r="' + ri + '"' + (st.done ? ' disabled' : '') + '><option value="">Choose a reason</option>';
          D.reasons.forEach(function (x) { h += '<option value="' + attr(x) + '"' + ((st.sel && st.sel[ri] === x) ? ' selected' : '') + '>' + x + '</option>'; });
          h += '</select>';
          if (st.done && !st.rowOk[ri]) h += '<div class="why">Correct reason: <b>' + r.r[0] + '</b></div>';
        }
        if (st.done) h += '<div class="why">' + r.why + '</div>';
        h += '</td></tr>';
      });
      h += '</table>';
      if (!st.done) h += '<div class="row"><button class="btn sm" data-act="check" data-id="' + id + '">Check my reasons</button></div>';
    } else if (q.t === 'open') {
      if (!st.shown) h += '<div class="row"><button class="btn sm" data-act="reveal" data-id="' + id + '">Show answer and steps</button></div>';
      else {
        h += '<div class="ans"><b>Answer</b><div>' + q.answer + '</div>' + (q.ansvg && D.svg[q.ansvg] ? '<div class="fig">' + D.svg[q.ansvg] + '</div>' : '') + '</div>' + stepsHTML(q);
        h += '<div class="row">' + (st.gotit ? '<span class="fb ok">Marked as solved</span>' : '<button class="btn sm" data-act="gotit" data-id="' + id + '">I got it</button>') +
          '<button class="btn ghost sm" data-act="retry" data-id="' + id + '">Hide</button></div>';
      }
    }
    if (q.t !== 'open' && st.done) {
      if (q.t === 'proof') h += '<div class="fb ' + (st.ok ? 'ok' : 'bad') + '">' + (st.ok ? 'Every reason is correct.' : 'Some reasons need another look. The right ones are shown above.') + '</div>';
      else h += '<div class="fb ' + (st.ok ? 'ok' : 'bad') + '">' + (st.ok ? 'Correct!' : 'Not quite.') + (q.t === 'text' && !st.ok ? ' Answer: <b>' + q.show + '</b>' : '') + '</div>' + stepsHTML(q);
      if (!isTest) h += '<div class="row"><button class="btn ghost sm" data-act="retry" data-id="' + id + '">Try again</button></div>';
    }
    return h + '</div>';
  }

  function refresh(id) {
    var el = $('q_' + id);
    if (!el) return;
    var t = document.createElement('div');
    t.innerHTML = card(id);
    el.replaceWith(t.firstChild);
    updateProgress();
  }

  function solvedCount(si) {
    var tot = 0, done = 0;
    D.sections[si].sets.forEach(function (set, a) { set.probs.forEach(function (p, b) { tot++; if (SAVED['p' + si + '_' + a + '_' + b]) done++; }); });
    return { total: tot, solved: done };
  }
  function updateProgress() {
    var el = $('pcount'); if (!el) return;
    var s = solvedCount(S.sec);
    el.textContent = s.solved + ' of ' + s.total + ' practice problems solved';
  }

  // ---------- nav and views
  function nav() {
    var items = [['home', 'Home']];
    D.sections.forEach(function (s, i) { items.push(['sec' + i, (s.short || s.id) + (s.new ? ' <span class="newb">NEW</span>' : '')]); });
    items.push(['flash', 'Flashcards'], ['tests', 'Practice tests']);
    var cur = S.view === 'section' ? 'sec' + S.sec : (S.view === 'test' || S.view === 'results' ? 'tests' : S.view);
    $('nav').innerHTML = '<span class="logo">📐 Geometry Ch. 3</span>' + items.map(function (it) {
      var c = it[0].indexOf('sec') === 0 ? COL[+it[0].slice(3)] : (it[0] === 'flash' ? '#fbbf24' : (it[0] === 'tests' ? '#f472b6' : '#e9ecf3'));
      return '<button class="nb' + (cur === it[0] ? ' on' : '') + '" style="--c:' + c + '" data-act="go" data-to="' + it[0] + '">' + it[1] + '</button>';
    }).join('');
  }

  function home() {
    var h = '<div class="hero"><h1>Geometry 4.1 and 4.2 Quiz Guide</h1><p>Everything for the 4.1 and 4.2 quiz: Apply Triangle Sum Properties (4.1), Congruence and Triangles (4.2), your class notes, the 4.2 homework and the 4.1 &ndash; 4.2 Quiz Review. Every problem shows how to get the answer.</p></div>' +
      '<div class="howto"><div><b>1. Learn it</b><span>Short lessons with a check-in after each idea.</span></div><div><b>2. Practice it</b><span>Problems from class. Check your answer, then see the steps.</span></div><div><b>3. Test yourself</b><span>3 practice tests that tell you which section to review.</span></div></div><div class="seccards">';
    D.sections.forEach(function (s, i) {
      var st = solvedCount(i);
      h += '<button class="sc" style="--c:' + COL[i] + '" data-act="go" data-to="sec' + i + '"><div class="id">' + (s.label || ('Section ' + s.id)) + (s.new ? ' <span class="newb">NEW</span>' : '') + '</div><h3>' + s.title + '</h3><p>' + s.blurb + '</p><div class="bar"><i style="width:' + (st.total ? 100 * st.solved / st.total : 0) + '%"></i></div><div class="small">' + st.solved + ' of ' + st.total + ' practice problems solved</div></button>';
    });
    h += '</div><div class="wide"><button class="sc" style="--c:#fbbf24" data-act="go" data-to="flash"><h3>🃏 Flashcards</h3><p>' + D.flash.length + ' key terms and rules. Tap to flip.</p></button>' +
      '<button class="sc" style="--c:#f472b6" data-act="go" data-to="tests"><h3>📝 Practice tests</h3><p>3 tests, 21 questions each, scored by section, with full solutions.</p></button></div>';
    return h;
  }

  function section() {
    var si = S.sec, s = D.sections[si], np = solvedCount(si).total;
    var h = '<div style="--c:' + COL[si] + '"><div class="sechead"><div class="id">' + (s.label || ('Section ' + s.id)) + '</div><h2>' + s.title + '</h2><div class="small" id="pcount"></div></div>' +
      '<div class="tabs"><button class="tab' + (S.tab === 'learn' ? ' on' : '') + '" data-act="tab" data-t="learn">1. Learn it</button><button class="tab' + (S.tab === 'practice' ? ' on' : '') + '" data-act="tab" data-t="practice">2. Practice problems (' + np + ')</button></div>';
    if (S.tab === 'learn') {
      s.topics.forEach(function (t, ti) {
        h += '<div class="topic"><h3><span class="n">' + (ti + 1) + '/' + s.topics.length + '</span>' + t.h + '</h3><div class="content">' + t.body + '</div>' + card('c' + si + '_' + ti) + '</div>';
      });
      h += '<div class="navrow"><span></span><button class="btn" data-act="tab" data-t="practice">Next: practice problems</button></div>';
    } else {
      s.sets.forEach(function (set, a) {
        h += '<div class="setbox"><h3>' + set.title + '</h3>' + (set.note ? '<div class="small">' + set.note + '</div>' : '');
        set.probs.forEach(function (p, b) { h += card('p' + si + '_' + a + '_' + b); });
        h += '</div>';
      });
      var nx = si < D.sections.length - 1 ? '<button class="btn" data-act="go" data-to="sec' + (si + 1) + '">Next section: ' + (D.sections[si + 1].short || D.sections[si + 1].id) + '</button>' : '<button class="btn" data-act="go" data-to="tests">Take a practice test</button>';
      h += '<div class="navrow"><button class="btn ghost" data-act="tab" data-t="learn">Back to lessons</button>' + nx + '</div>';
    }
    return h + '</div>';
  }

  // ---------- flashcards
  function flashOrder() {
    var f = S.fl;
    var idx = [];
    D.flash.forEach(function (c, i) { if (f.sec < 0 || c.sec === f.sec) idx.push(i); });
    if (f.order && f.sig === f.sec) { return f.order; }
    f.order = idx; f.sig = f.sec;
    return idx;
  }
  function flash() {
    var f = S.fl, idx = flashOrder();
    if (f.i >= idx.length) f.i = 0;
    var c = D.flash[idx[f.i]];
    var h = '<div class="sechead" style="--c:#fbbf24"><div class="id">Flashcards</div><h2>Key terms and rules</h2></div><div class="chips">';
    [[-1, 'All']].concat(D.sections.map(function (s, i) { return [i, s.short || s.id]; })).forEach(function (x) { h += '<button class="chip' + (f.sec === x[0] ? ' on' : '') + '" data-act="fsec" data-s="' + x[0] + '">' + x[1] + '</button>'; });
    h += '</div><div class="small">Card ' + (f.i + 1) + ' of ' + idx.length + ' &middot; ' + (D.sections[c.sec].short || D.sections[c.sec].id) + '</div><div class="fl"><button class="fcard' + (f.flip ? ' back' : '') + '" style="--c:' + COL[c.sec] + '" data-act="flip">' +
      '<div>' + (f.flip ? c.back + '<small>tap to flip back</small>' : c.front + '<small>tap to see the answer</small>') + '</div></button></div>' +
      '<div class="navrow"><button class="btn ghost" data-act="fprev">Previous</button><button class="btn ghost" data-act="fshuf">Shuffle</button><button class="btn" data-act="fnext">Next</button></div>';
    return h;
  }

  // ---------- tests
  function bestKey(ti) { return 'best' + ti; }
  function testsList() {
    var h = '<div class="sechead" style="--c:#f472b6"><div class="id">Practice tests</div><h2>3 tests, 21 questions each</h2><div class="small">Each test has questions from 4.1, 4.2 and the quiz review. You get a score for each section at the end, with a link to review the ones you missed.</div></div><div class="seccards">';
    D.tests.forEach(function (t, ti) {
      var b = SAVED[bestKey(ti)];
      h += '<button class="sc" style="--c:#f472b6" data-act="start" data-t="' + ti + '"><div class="id">Test ' + (ti + 1) + '</div><h3>' + t.qs.length + ' questions</h3><p>' + (b !== undefined ? 'Best score: ' + b + ' / ' + t.qs.length : 'Not taken yet') + '</p></button>';
    });
    return h + '</div>';
  }
  function startTest(ti) {
    var t = D.tests[ti];
    t.qs.forEach(function (q, qi) { delete ST['t' + ti + '_' + qi]; });
    S.T = { ti: ti, i: 0, res: [], perm: t.qs.map(function (q) { if (q.t === 'mc') { var a = q.opts.map(function (_, i) { return i; }); return shuffle(a); } return null; }) };
    S.view = 'test'; render();
  }
  function testView() {
    var T = S.T, t = D.tests[T.ti], id = 't' + T.ti + '_' + T.i, st = ST[id] || {};
    var h = '<div class="tprog"><b>' + t.title + '</b><span>Question ' + (T.i + 1) + ' of ' + t.qs.length + ' &middot; ' + (D.sections[t.qs[T.i].sec].short || D.sections[t.qs[T.i].sec].id) + '</span></div><div class="bar" style="--c:#f472b6"><i style="width:' + (100 * T.i / t.qs.length) + '%"></i></div>' + card(id);
    var last = T.i === t.qs.length - 1;
    h += '<div class="navrow"><button class="btn ghost" data-act="go" data-to="tests">Quit test</button><button class="btn" data-act="tnext"' + ((st.done || st.gotit) ? '' : ' disabled') + '>' + (last ? 'See results' : 'Next question') + '</button></div>';
    return h;
  }
  function results() {
    var T = S.T, t = D.tests[T.ti], total = 0, per = D.sections.map(function () { return [0, 0, []]; });
    t.qs.forEach(function (q, qi) { per[q.sec][1]++; if (T.res[qi]) { total++; per[q.sec][0]++; } else per[q.sec][2].push(qi); });
    var h = '<div class="sechead" style="--c:#f472b6"><div class="id">' + t.title + ' results</div><div class="score">' + total + ' / ' + t.qs.length + '</div><div class="small">' + Math.round(100 * total / t.qs.length) + '%</div></div><div class="secres">';
    per.forEach(function (p, si) {
      if (!p[1]) return;
      h += '<div style="--c:' + COL[si] + '"><b>' + (D.sections[si].label || ('Section ' + D.sections[si].id)) + ': ' + p[0] + ' of ' + p[1] + '</b><div class="bar" style="margin:6px 0"><i style="width:' + (p[1] ? 100 * p[0] / p[1] : 0) + '%"></i></div>';
      if (p[2].length) {
        h += '<div class="small">Missed:</div><ul class="miss">' + p[2].map(function (qi) { return '<li>' + t.qs[qi].q.replace(/<[^>]+>/g, '') + '</li>'; }).join('') + '</ul>';
        h += '<div class="row"><button class="btn sm" data-act="review" data-s="' + si + '">Review ' + (D.sections[si].short || D.sections[si].id) + '</button></div>';
      } else h += '<div class="small">Perfect in this section.</div>';
      h += '</div>';
    });
    h += '</div><div class="navrow"><button class="btn ghost" data-act="go" data-to="tests">All tests</button><button class="btn" data-act="start" data-t="' + T.ti + '">Retake this test</button></div>';
    return h;
  }

  function render() {
    nav();
    var app = $('app');
    if (S.view === 'home') app.innerHTML = home();
    else if (S.view === 'section') { app.innerHTML = section(); updateProgress(); }
    else if (S.view === 'flash') app.innerHTML = flash();
    else if (S.view === 'tests') app.innerHTML = testsList();
    else if (S.view === 'test') app.innerHTML = testView();
    else if (S.view === 'results') app.innerHTML = results();
  }
  function go(to) {
    if (to.indexOf('sec') === 0) { S.view = 'section'; S.sec = +to.slice(3); S.tab = 'learn'; }
    else S.view = to;
    render(); window.scrollTo(0, 0);
  }

  // ---------- actions
  function finish(id, ok) {
    var st = ST[id]; st.done = true; st.ok = ok;
    if (id.charAt(0) === 't') { var p = id.split('_'); S.T.res[+p[1]] = ok; }
    else if (ok) { SAVED[id] = 1; save(); }
  }
  function onClick(e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.tagName === 'SELECT') return;
    var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), q = id ? Q[id] : null, st = id ? (ST[id] || (ST[id] = {})) : null;
    if (act === 'go') go(el.getAttribute('data-to'));
    else if (act === 'tab') { S.tab = el.getAttribute('data-t'); render(); window.scrollTo(0, 0); }
    else if (act === 'pick') { if (st.done) return; st.sel = +el.getAttribute('data-i'); finish(id, st.sel === q.ans); refresh(id); if (S.view === 'test') render2(); }
    else if (act === 'check') {
      if (st.done) return;
      if (q.t === 'text') { var inp = document.querySelector('input.ti[data-id="' + id + '"]'); st.val = inp ? inp.value : st.val; if (!st.val || !String(st.val).trim()) return; finish(id, textOK(q, st.val)); }
      else if (q.t === 'proof') {
        st.rowOk = []; var all = true;
        q.rows.forEach(function (r, ri) { var ok = r.fixed || (st.sel && r.r.indexOf(st.sel[ri]) >= 0); st.rowOk[ri] = !!ok; if (!ok) all = false; });
        finish(id, all);
      }
      refresh(id); if (S.view === 'test') render2();
    }
    else if (act === 'reveal') { st.shown = true; refresh(id); }
    else if (act === 'gotit') { st.gotit = true; st.ok = true; if (id.charAt(0) === 't') { S.T.res[+id.split('_')[1]] = true; } else { SAVED[id] = 1; save(); } refresh(id); if (S.view === 'test') render2(); }
    else if (act === 'retry') { delete ST[id]; if (id.charAt(0) !== 't') { delete SAVED[id]; save(); } refresh(id); }
    else if (act === 'fsec') { S.fl.sec = +el.getAttribute('data-s'); S.fl.i = 0; S.fl.flip = false; S.fl.order = null; render(); }
    else if (act === 'flip') { S.fl.flip = !S.fl.flip; render(); }
    else if (act === 'fnext') { S.fl.i = (S.fl.i + 1) % flashOrder().length; S.fl.flip = false; render(); }
    else if (act === 'fprev') { var n = flashOrder().length; S.fl.i = (S.fl.i - 1 + n) % n; S.fl.flip = false; render(); }
    else if (act === 'fshuf') { S.fl.order = shuffle(flashOrder().slice()); S.fl.i = 0; S.fl.flip = false; render(); }
    else if (act === 'start') startTest(+el.getAttribute('data-t'));
    else if (act === 'tnext') {
      var T = S.T, tt = D.tests[T.ti];
      if (T.i < tt.qs.length - 1) { T.i++; S.view = 'test'; } else { S.view = 'results'; var best = SAVED[bestKey(T.ti)], sc = T.res.filter(Boolean).length; if (best === undefined || sc > best) { SAVED[bestKey(T.ti)] = sc; save(); } }
      render(); window.scrollTo(0, 0);
    }
    else if (act === 'review') { S.view = 'section'; S.sec = +el.getAttribute('data-s'); S.tab = 'learn'; render(); window.scrollTo(0, 0); }
  }
  // enable the Next button without re-rendering the question the student is reading
  function render2() {
    var b = document.querySelector('[data-act="tnext"]');
    if (b) b.removeAttribute('disabled');
  }
  function onChange(e) {
    var el = e.target;
    if (el.getAttribute && el.getAttribute('data-act') === 'psel') {
      var id = el.getAttribute('data-id'), st = ST[id] || (ST[id] = {});
      st.sel = st.sel || []; st.sel[+el.getAttribute('data-r')] = el.value;
    }
  }
  function onInput(e) {
    var el = e.target;
    if (el.classList && el.classList.contains('ti')) { var id = el.getAttribute('data-id'); (ST[id] || (ST[id] = {})).val = el.value; }
  }
  function onKey(e) {
    var el = e.target;
    if (e.key === 'Enter' && el.classList && el.classList.contains('ti')) {
      var b = document.querySelector('[data-act="check"][data-id="' + el.getAttribute('data-id') + '"]');
      if (b) b.click();
    }
  }
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', onKey);
  render();
})();
</script>
</body>
</html>
